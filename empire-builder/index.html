    this.diplomacy = {}; // key "a|b" sorted ids -> PEACE|WAR
    this.barbarianCamps = [];
    this.nextCampId = 1;
  },

  getCiv(id){ return this.civilizations.find(c => c.id === id) || null; },
  playerCiv(){ return this.getCiv(this.playerCivId); },
  syncCivAlias(){ this.civ = this.playerCiv() || this.civ; },

  yearLabel(){
    const yearsPassed = (this.turn - 1) * 25;
    const year = -4000 + yearsPassed;
    if (year < 0) return Math.abs(year) + " BC";
    return year + " AD";
  },

  createCivilization(opts){
    const civ = {
      id: this.nextCivId++,
      name: opts.name || "Civilization",
      leader: opts.leader || "Leader",
      color: opts.color || "#1c62d6",
      isPlayer: !!opts.isPlayer,
      difficulty: opts.difficulty || "NORMAL",
      gold: 0,
      gpt: 0,
      luxuries: [],
      strategic: {},
      science: 0,
      sciencePerTurn: 0,
      scienceProgress: 0,
      researching: null,
      techs: {}
    };
    this.civilizations.push(civ);
    if (civ.isPlayer){
      this.playerCivId = civ.id;
      this.civ = civ;
      this.discoveredCivs[civ.id] = true;
    }
    return civ;
  },

  addUnit(type, col, row, civId){
    const civ = this.getCiv(civId != null ? civId : this.playerCivId) || this.civ;
    const def = UNIT_DEFS[type] || {};
    const moves = def.moves != null ? def.moves :
      (type === "SETTLER" ? CONFIG.SETTLER_MOVE :
       type === "BUILDER" ? CONFIG.BUILDER_MOVE : CONFIG.WARRIOR_MOVE);
    const isBarb = (civId === CONFIG.BARBARIAN_CIV_ID) || type === "BARBARIAN_WARRIOR";
    const maxH = def.civilian ? 0 : (def.maxHealth || 100);
    const unit = {
      id: this.nextUnitId++,
      type, col, row,
      movesMax: moves,
      moves: moves,
      civId: isBarb ? CONFIG.BARBARIAN_CIV_ID : (civ ? civ.id : this.playerCivId),
      civColor: isBarb ? "#5a4030" : (civ ? civ.color : "#1c62d6"),
      skipped: false,
      charges: type === "BUILDER" ? (def.charges || CONFIG.BUILDER_CHARGES) : null,
      combatStrength: def.combatStrength || 0,
      maxHealth: maxH,
      health: maxH,
      hasAttacked: false,
      turnComplete: false,
      stance: null // null | "FORTIFY" | "HEAL"
    };
    this.units.push(unit);
    return unit;
  },

  unitAt(col, row){
    return this.units.find(u => u.col === col && u.row === row) || null;
  },
  cityAt(col, row){
    return this.cities.find(c => c.col === col && c.row === row) || null;
  },
  getUnit(id){ return this.units.find(u => u.id === id) || null; },
  getCity(id){ return this.cities.find(c => c.id === id) || null; },
  getDistrict(id){ return this.districts.find(d => d.id === id) || null; },
  districtAt(col, row){ return this.districts.find(d => d.col === col && d.row === row) || null; },

  removeUnit(id){
    this.units = this.units.filter(u => u.id !== id);
    if (this.selectedUnitId === id) this.selectedUnitId = null;
  },

  citiesOf(civId){ return this.cities.filter(c => c.civId === civId); },
  unitsOf(civId){ return this.units.filter(u => u.civId === civId); },

  spawnUnitNearCity(city, type){
    if (!this.unitAt(city.col, city.row)){
      return this.addUnit(type, city.col, city.row, city.civId);
    }
    const neighbors = HexGrid.neighbors(city.col, city.row);
    for (const n of neighbors){
      if (n.col < 0 || n.row < 0 || n.col >= this.world.w || n.row >= this.world.h) continue;
      const t = this.world.grid[n.row][n.col];
      if (!TERRAIN[t.terrain].passable) continue;
      if (this.unitAt(n.col, n.row)) continue;
      return this.addUnit(type, n.col, n.row, city.civId);
    }
    return this.addUnit(type, city.col, city.row, city.civId);
  },

  founderFoundCity(unit, name){
    const civ = this.getCiv(unit.civId) || this.civ;
    const city = {
      id: this.nextCityId++,
      name: name || (civ ? civ.name : "New City"),
      col: unit.col, row: unit.row,
      population: 1,
      food: 0,
      foodNeeded: 12,
      culture: 0,
      cultureNeeded: 20,
      borderRadius: CONFIG.CITY_CLAIM_RADIUS,
      buildings: [], // city center buildings
      project: null,
      workedTiles: [],
      civId: unit.civId,
      civColor: unit.civColor,
      founded: this.turn,
      maxHealth: CONFIG.CITY_MAX_HP,
      health: CONFIG.CITY_MAX_HP,
      defenseStrength: CONFIG.CITY_BASE_DEFENSE
    };
    this.cities.push(city);
    const tile = this.world.grid[unit.row][unit.col];
    tile.cityId = city.id;
    CityTerritory.claimInitial(city);
    Citizens.autoAssign(city);
    this.units = this.units.filter(u => u.id !== unit.id);
    if (this.selectedUnitId === unit.id) this.selectedUnitId = null;
    FogOfWar.recompute();
    ConnectedResources.recompute();
    if (civ && civ.isPlayer) Notify.push(city.name + " founded.");
    return city;
  }
};

/* ---------------------------------------------------------------------------
   5. FOG OF WAR
--------------------------------------------------------------------------- */
const FogOfWar = {
  recompute(){
    const world = Game.world;
    if (!world) return;
    // demote all currently-visible tiles to "explored"
    for (let row = 0; row < world.h; row++){
      for (let col = 0; col < world.w; col++){
        if (world.grid[row][col].fog === 2) world.grid[row][col].fog = 1;
      }
    }
    // Player vision only — AI keeps its own internal awareness, not shown on map
    const pid = Game.playerCivId;
    const sources = [
      ...Game.units.filter(u => u.civId === pid).map(u => ({ col: u.col, row: u.row, radius: CONFIG.VISION_RADIUS })),
      ...Game.cities.filter(c => c.civId === pid).map(c => ({ col: c.col, row: c.row, radius: CONFIG.VISION_RADIUS + (c.borderRadius || 1) }))
    ];
    for (const src of sources){
      const tiles = HexGrid.tilesWithinRadius(src.col, src.row, src.radius);
      for (const t of tiles){
        if (t.col < 0 || t.row < 0 || t.col >= world.w || t.row >= world.h) continue;
        world.grid[t.row][t.col].fog = 2;
      }
    }
  }
};

/* ---------------------------------------------------------------------------
   5b. CITY TERRITORY
--------------------------------------------------------------------------- */
const CityTerritory = {
  claimInitial(city){
    const world = Game.world;
    const tiles = HexGrid.tilesWithinRadius(city.col, city.row, CONFIG.CITY_CLAIM_RADIUS);
    for (const t of tiles){
      if (t.col < 0 || t.row < 0 || t.col >= world.w || t.row >= world.h) continue;
      const tile = world.grid[t.row][t.col];
      if (tile.ownerId == null) tile.ownerId = city.id;
    }
    city.borderRadius = CONFIG.CITY_CLAIM_RADIUS;
  },

  ownedTiles(city){
    const world = Game.world;
    const out = [];
    for (let row = 0; row < world.h; row++){
      for (let col = 0; col < world.w; col++){
        if (world.grid[row][col].ownerId === city.id) out.push({ col, row });
      }
    }
    return out;
  },

  cityOwnsTile(city, col, row){
    const tile = Game.world.grid[row][col];
    return tile && tile.ownerId === city.id;
  },

  civOwnsTile(civId, col, row){
    const tile = Game.world.grid[row][col];
    if (!tile || tile.ownerId == null) return false;
    const city = Game.getCity(tile.ownerId);
    return city && city.civId === civId;
  },

  /* Tiles adjacent to owned territory that are unowned */
  purchasableTiles(city){
    const owned = this.ownedTiles(city);
    const seen = new Set();
    const out = [];
    for (const o of owned){
      for (const n of HexGrid.neighbors(o.col, o.row)){
        if (n.col < 0 || n.row < 0 || n.col >= Game.world.w || n.row >= Game.world.h) continue;
        const key = n.col + "," + n.row;
        if (seen.has(key)) continue;
        seen.add(key);
        const tile = Game.world.grid[n.row][n.col];
        if (tile.ownerId != null) continue;
        if (tile.terrain === "OCEAN") continue;
        const dist = HexGrid.distance(city.col, city.row, n.col, n.row);
        if (dist > 5) continue; // soft max distance from city center
        out.push({ col: n.col, row: n.row, dist, cost: this.tileCost(city, n.col, n.row) });
      }
    }
    return out;
  },

  tileCost(city, col, row){
    const dist = HexGrid.distance(city.col, city.row, col, row);
    return 10 + dist * 15; // 10 + 15 per hex from city
  },

  buyTile(city, col, row){
    const civ = Game.getCiv(city.civId);
    if (!civ) return false;
    const eligible = this.purchasableTiles(city).find(t => t.col === col && t.row === row);
    if (!eligible) return false;
    if (civ.gold < eligible.cost){
      if (civ.isPlayer) Notify.push("Not enough Gold (" + eligible.cost + " required).");
      return false;
    }
    civ.gold -= eligible.cost;
    Game.world.grid[row][col].ownerId = city.id;
    if (civ.isPlayer){
      Game.syncCivAlias();
      Notify.push("Purchased tile for " + eligible.cost + " Gold.");
    }
    Citizens.autoAssign(city);
    FogOfWar.recompute();
    return true;
  }
};

/* ---------------------------------------------------------------------------
   5c. TILE / CITY YIELDS
--------------------------------------------------------------------------- */
function listCityBuildingIds(city){
  const ids = Array.isArray(city.buildings) ? city.buildings.slice() : [];
  for (const d of Game.districts){
    if (d.cityId === city.id && d.state === "COMPLETED" && Array.isArray(d.buildings)){
      for (const b of d.buildings) ids.push(b);
    }
  }
  return ids;
}

const Yields = {
  getTerrainYield(tile){
    const def = TERRAIN[tile.terrain];
    return { food: def.food || 0, production: def.prod || 0, gold: def.gold || 0 };
  },
  getResourceYield(tile){
    if (!tile.resource) return { food: 0, production: 0, gold: 0 };
    const res = RESOURCES[tile.resource];
    if (!res) return { food: 0, production: 0, gold: 0 };
    return { food: res.food || 0, production: res.prod || 0, gold: res.gold || 0 };
  },
  getImprovementYield(tile){
    if (!tile.improvement) return { food: 0, production: 0, gold: 0 };
    const imp = IMPROVEMENTS[tile.improvement];
    if (!imp) return { food: 0, production: 0, gold: 0 };
    return { food: imp.food || 0, production: imp.prod || 0, gold: imp.gold || 0 };
  },
  tileYields(col, row){
    const tile = Game.world.grid[row][col];
    const a = this.getTerrainYield(tile);
    const b = this.getResourceYield(tile);
    const c = this.getImprovementYield(tile);
    return {
      food: a.food + b.food + c.food,
      production: a.production + b.production + c.production,
      gold: a.gold + b.gold + c.gold
    };
  },
  centerYields(){
    return { food: 2, production: 1, gold: 1 };
  },
  buildingBonuses(city){
    const b = { food: 0, production: 0, gold: 0, culture: 0, science: 0, foodNeededMult: 1 };
    const ids = listCityBuildingIds(city);
    for (const id of ids){
      const def = BUILDINGS[id];
      if (!def || !def.bonuses) continue;
      if (def.bonuses.food) b.food += def.bonuses.food;
      if (def.bonuses.production) b.production += def.bonuses.production;
      if (def.bonuses.gold) b.gold += def.bonuses.gold;
      if (def.bonuses.culture) b.culture += def.bonuses.culture;
      if (def.bonuses.science) b.science += def.bonuses.science;
      if (def.bonuses.foodNeededMult) b.foodNeededMult *= def.bonuses.foodNeededMult;
    }
    return b;
  },
  cityTotals(city){
    const center = this.centerYields();
    let food = center.food, production = center.production, gold = center.gold;
    const worked = Array.isArray(city.workedTiles) ? city.workedTiles : [];
    for (const wt of worked){
      if (!wt) continue;
      const y = this.tileYields(wt.col, wt.row);
      food += y.food;
      production += y.production;
      gold += y.gold;
    }
    const bb = this.buildingBonuses(city);
    food += bb.food;
    production += bb.production;
    gold += bb.gold;
    return { food, production, gold, culture: bb.culture, foodNeededMult: bb.foodNeededMult };
  }
};

/* ---------------------------------------------------------------------------
   5d. CITIZEN ASSIGNMENT
--------------------------------------------------------------------------- */
const Citizens = {
  autoAssign(city){
    const owned = CityTerritory.ownedTiles(city);
    const candidates = owned.filter(t => !(t.col === city.col && t.row === city.row));
    const workable = candidates.filter(t => {
      const def = TERRAIN[Game.world.grid[t.row][t.col].terrain];
      return def.workable;
    });
    const needsFood = city.food < city.foodNeeded * 0.6 || city.population < 3;
    const hasProject = !!city.project;
    workable.forEach(t => {
      const y = Yields.tileYields(t.col, t.row);
      let score = y.food * (needsFood ? 4 : 2) + y.production * (hasProject ? 3.5 : 2) + y.gold * 1.5;
      score -= HexGrid.distance(city.col, city.row, t.col, t.row) * 0.3;
      t._score = score;
    });
    workable.sort((a, b) => b._score - a._score);
    const slots = Math.min(city.population, workable.length);
    city.workedTiles = workable.slice(0, slots).map(t => ({ col: t.col, row: t.row }));
  },
  isWorked(col, row){
    for (const city of Game.cities){
      if (city.workedTiles.some(t => t.col === col && t.row === row)) return city;
    }
    return null;
  }
};

/* ---------------------------------------------------------------------------
   5e. PRODUCTION (units + buildings)
--------------------------------------------------------------------------- */
const Production = {
  normalize(project){
    if (!project) return null;
    // Legacy shape { buildingId, progress }
    if (project.buildingId && !project.type){
      return {
        type: "BUILDING",
        id: String(project.buildingId),
        progress: Math.max(0, Number(project.progress) || 0)
      };
    }
    const type = (project.type === "UNIT" || project.type === "BUILDING" || project.type === "DISTRICT") ? project.type : null;
    const id = project.id != null ? String(project.id) : null;
    if (!type || !id) return null;
    return {
      type,
      id,
      progress: Math.max(0, Number(project.progress) || 0)
    };
  },

  availableBuildings(city){
    if (!city.buildings) city.buildings = [];
    const civ = Game.getCiv(city.civId);
    return Object.values(BUILDINGS).filter(b => {
      if (civ && !TechSystem.buildingUnlocked(civ, b.id)) return false;
      if (b.location === "CITY_CENTER"){
        return !city.buildings.includes(b.id);
      }
      const dist = Districts.completedOfType(city.id, b.location);
      if (!dist) return false;
      return !dist.buildings.includes(b.id);
    });
  },
  availableUnits(city){
    const civ = Game.getCiv(city.civId);
    return Object.values(UNIT_DEFS).filter(u => {
      if (u.buildable === false || u.barbarian) return false;
      if (civ && !TechSystem.unitUnlocked(civ, u.id)) return false;
      return true;
    });
  },
  availableDistricts(city){
    const civ = Game.getCiv(city.civId);
    return Object.values(DISTRICTS).filter(d => {
      if (civ && !TechSystem.districtUnlocked(civ, d.id)) return false;
      if (Districts.completedOfType(city.id, d.id)) return false;
      if (Game.districts.some(x => x.cityId === city.id && x.type === d.id && x.state !== "COMPLETED")) return false;
      return true;
    });
  },

  startProject(city, type, id){
    type = String(type || "").toUpperCase();
    id = String(id || "");
    if (type === "BUILDING"){
      if (!BUILDINGS[id]) return false;
      const def = BUILDINGS[id];
      if (def.location === "CITY_CENTER"){
        if (!city.buildings) city.buildings = [];
        if (city.buildings.includes(id)) return false;
      } else {
        const dist = Districts.completedOfType(city.id, def.location);
        if (!dist || dist.buildings.includes(id)) return false;
      }
    } else if (type === "UNIT"){
      if (!UNIT_DEFS[id]) return false;
    } else if (type === "DISTRICT"){
      // Districts start via Districts.confirmPlacement, not here
      return false;
    } else return false;

    const cur = this.normalize(city.project);
    if (cur && cur.type === type && cur.id === id){
      city.project = cur;
      return true;
    }

    city.project = { type, id, progress: 0 };
    return true;
  },

  projectCost(project){
    const p = this.normalize(project);
    if (!p) return 0;
    if (p.type === "BUILDING"){
      const def = BUILDINGS[p.id];
      return def && def.cost > 0 ? def.cost : 0;
    }
    if (p.type === "UNIT"){
      const def = UNIT_DEFS[p.id];
      return def && def.cost > 0 ? def.cost : 0;
    }
    if (p.type === "DISTRICT"){
      const def = DISTRICTS[p.id];
      return def && def.cost > 0 ? def.cost : 0;
    }
    return 0;
  },

  projectName(project){
    const p = this.normalize(project);
    if (!p) return null;
    if (p.type === "BUILDING") return (BUILDINGS[p.id] && BUILDINGS[p.id].name) || p.id;
    if (p.type === "UNIT") return (UNIT_DEFS[p.id] && UNIT_DEFS[p.id].name) || p.id;
    if (p.type === "DISTRICT") return (DISTRICTS[p.id] && DISTRICTS[p.id].name) || p.id;
    return p.id;
  },

  advance(city, prodPoints){
    if (!city.project) return null;

    const normalized = this.normalize(city.project);
    if (!normalized){
      // Corrupt project — clear only if unrecoverable
      city.project = null;
      return null;
    }
    // Write normalized form back so progress is always a real number
    city.project = normalized;

    const cost = this.projectCost(city.project);
    if (cost <= 0){
      // Unknown unit/building id — do not wipe silently every turn
      return null;
    }

    const add = Math.max(0, Math.floor(Number(prodPoints) || 0));
    city.project.progress += add;
    // Mirror progress onto under-construction district
    if (city.project.type === "DISTRICT" && city.project.districtId){
      const dist = Game.getDistrict(city.project.districtId);
      if (dist) dist.progress = city.project.progress;
    }

    if (city.project.progress < cost){
      return null; // still building
    }

    // Complete: apply result FIRST, only then clear project
    const proj = { type: city.project.type, id: city.project.id, progress: city.project.progress };
    let result = null;

    if (proj.type === "BUILDING"){
      const bdef = BUILDINGS[proj.id];
      const name = (bdef && bdef.name) || proj.id;
      if (bdef && bdef.location && bdef.location !== "CITY_CENTER"){
        const dist = Districts.completedOfType(city.id, bdef.location);
        if (!dist){
          city.project.progress = cost - 1;
          return null;
        }
        Districts.addBuilding(dist, proj.id);
      } else {
        if (!city.buildings) city.buildings = [];
        if (!city.buildings.includes(proj.id)) city.buildings.push(proj.id);
      }
      const civ = Game.getCiv(city.civId);
      if (civ && civ.isPlayer) Notify.push(name + " completed in " + city.name + ".");
      result = { type: "BUILDING", id: proj.id, name };
    } else if (proj.type === "UNIT"){
      const def = UNIT_DEFS[proj.id];
      if (!def){
        city.project.progress = cost - 1;
        return null;
      }
      Game.spawnUnitNearCity(city, proj.id);
      FogOfWar.recompute();
      const civ = Game.getCiv(city.civId);
      if (civ && civ.isPlayer) Notify.push(def.name + " trained in " + city.name + ".");
      result = { type: "UNIT", id: proj.id, name: def.name };
    } else if (proj.type === "DISTRICT"){
      const dist = Game.getDistrict(city.project.districtId) ||
        Game.districts.find(d => d.cityId === city.id && d.type === proj.id && d.state === "UNDER_CONSTRUCTION");
      if (!dist){
        city.project.progress = cost - 1;
        return null;
      }
      dist.progress = cost;
      Districts.complete(dist);
      result = { type: "DISTRICT", id: proj.id, name: Production.projectName(proj) };
    } else {
      return null;
    }

    city.project = null;
    return result;
  },

  turnsRemaining(city){
    if (!city.project) return null;
    const cost = this.projectCost(city.project);
    if (cost <= 0) return null;
    const totals = Yields.cityTotals(city);
    const progress = (this.normalize(city.project) || {}).progress || 0;
    const remaining = cost - progress;
    if (totals.production <= 0) return 99;
    return Math.max(1, Math.ceil(remaining / totals.production));
  }
};


/* ---------------------------------------------------------------------------
   5e2. DISTRICTS + PLACEMENT
--------------------------------------------------------------------------- */
const Districts = {
  cityDistricts(cityId){
    return Game.districts.filter(d => d.cityId === cityId);
  },
  completedOfType(cityId, type){
    return Game.districts.find(d => d.cityId === cityId && d.type === type && d.state === "COMPLETED");
  },
  countForCity(cityId){
    return Game.districts.filter(d => d.cityId === cityId && d.state !== "CANCELLED").length;
  },
  canBuildMore(city){
    return this.countForCity(city.id) < districtCapacity(city.population);
  },
  validPlacementTiles(city, districtType){
    const owned = CityTerritory.ownedTiles(city);
    const out = [];
    for (const t of owned){
      if (t.col === city.col && t.row === city.row) continue;
      const tile = Game.world.grid[t.row][t.col];
      if (tile.cityId != null) continue;
      if (tile.districtId != null) continue;
      if (Game.districtAt(t.col, t.row)) continue;
      if (tile.improvement) continue;
      const def = TERRAIN[tile.terrain];
      if (!def.passable) continue;
      if (tile.terrain === "COAST" || tile.terrain === "OCEAN") continue;
      out.push({ col: t.col, row: t.row });
    }
    return out;
  },
  beginPlacement(city, districtType){
    if (!DISTRICTS[districtType]) return false;
    if (!this.canBuildMore(city)){
      Notify.push("District capacity reached. Grow the city to unlock more.");
      return false;
    }
    if (this.completedOfType(city.id, districtType)){
      Notify.push("This city already has a " + DISTRICTS[districtType].name + ".");
      return false;
    }
    // Already building this type?
    if (Game.districts.some(d => d.cityId === city.id && d.type === districtType && d.state !== "COMPLETED")){
      Notify.push("That district is already under construction.");
      return false;
    }
    const valid = this.validPlacementTiles(city, districtType);
    if (!valid.length){
      Notify.push("No valid tiles for this district. Expand borders or clear improvements.");
      return false;
    }
    Game.placement = { cityId: city.id, districtType, valid };
    Selection.clear();
    Notify.push("Choose a hex for " + DISTRICTS[districtType].name + ". Press Escape to cancel.");
    render();
    return true;
  },
  cancelPlacement(){
    if (Game.placement){
      Game.placement = null;
      render();
    }
  },
  confirmPlacement(col, row){
    if (!Game.placement) return false;
    const { cityId, districtType, valid } = Game.placement;
    if (!valid.some(t => t.col === col && t.row === row)) return false;
    const city = Game.getCity(cityId);
    if (!city) return false;
    const district = {
      id: Game.nextDistrictId++,
      type: districtType,
      cityId,
      civId: city.civId,
      col, row,
      state: "PLANNED", // PLANNED -> UNDER_CONSTRUCTION -> COMPLETED
      buildings: [],
      progress: 0
    };
    Game.districts.push(district);
    const tile = Game.world.grid[row][col];
    tile.districtId = district.id;
    // Clear resource visual conflict is ok; improvement blocked already
    city.project = {
      type: "DISTRICT",
      id: districtType,
      districtId: district.id,
      progress: 0
    };
    district.state = "UNDER_CONSTRUCTION";
    Game.placement = null;
    Notify.push(DISTRICTS[districtType].name + " construction begun near " + city.name + ".");
    refreshCityWindow(city);
    render();
    return true;
  },
  complete(district){
    district.state = "COMPLETED";
    district.progress = DISTRICTS[district.type] ? DISTRICTS[district.type].cost : district.progress;
    const city = Game.getCity(district.cityId);
    const name = DISTRICTS[district.type] ? DISTRICTS[district.type].name : district.type;
    if (city){
      const civ = Game.getCiv(city.civId);
      if (civ && civ.isPlayer) Notify.push(name + " completed in " + city.name + ".");
    }
  },
  addBuilding(district, buildingId){
    if (!district.buildings.includes(buildingId)) district.buildings.push(buildingId);
  }
};

/* ---------------------------------------------------------------------------
   5f. IMPROVEMENTS / BUILDERS
--------------------------------------------------------------------------- */
const Improvements = {
  ownsTile(unit, col, row){
    return CityTerritory.civOwnsTile(unit.civId, col, row);
  },
  canBuild(unit, col, row, improvementId){
    if (!unit || unit.type !== "BUILDER") return false;
    if (unit.charges == null || unit.charges <= 0) return false;
    if (unit.col !== col || unit.row !== row) return false;
    const tile = Game.world.grid[row][col];
    if (tile.improvement) return false;
    if (tile.cityId != null) return false;
    if (tile.districtId != null || Game.districtAt(col, row)) return false;
    if (!this.ownsTile(unit, col, row)) return false;

    if (improvementId === "REMOVE_FOREST"){
      return tile.terrain === "FOREST" || tile.feature === "FOREST";
    }

    const civ = Game.getCiv(unit.civId);
    if (civ && !TechSystem.improvementUnlocked(civ, improvementId)) return false;

    const def = IMPROVEMENTS[improvementId];
    if (!def) return false;

    const hasForest = tile.terrain === "FOREST" || tile.feature === "FOREST";
    if (hasForest && improvementId !== "CAMP") return false;

    if (def.water){
      if (tile.terrain !== "COAST") return false;
      if (def.requiresResource && (!tile.resource || !def.resourceOk.includes(tile.resource))) return false;
      return true;
    }
    if (!TERRAIN[tile.terrain].passable && tile.terrain !== "FOREST") return false;
    if (def.requiresResource){
      if (!tile.resource || !def.resourceOk.includes(tile.resource)) return false;
      return true;
    }
    if (tile.resource && def.resourceOk && def.resourceOk.includes(tile.resource)) return true;
    if (def.terrains && def.terrains.includes(tile.terrain)) return true;
    return false;
  },
  validActions(unit){
    if (!unit || unit.type !== "BUILDER") return [];
    if (!this.ownsTile(unit, unit.col, unit.row)) return [];
    const out = [];
    const tile = Game.world.grid[unit.row][unit.col];
    if (tile.terrain === "FOREST" || tile.feature === "FOREST") out.push("REMOVE_FOREST");
    for (const id of Object.keys(IMPROVEMENTS)){
      if (this.canBuild(unit, unit.col, unit.row, id)) out.push(id);
    }
    return out;
  },
  build(unit, improvementId){
    if (improvementId === "REMOVE_FOREST"){
      if (!this.canBuild(unit, unit.col, unit.row, "REMOVE_FOREST")) return false;
      const tile = Game.world.grid[unit.row][unit.col];
      tile.terrain = "GRASSLAND";
      tile.feature = null;
      unit.charges -= 1;
      unit.moves = 0;
      const city = Game.cities.find(c => c.id === tile.ownerId);
      if (city && city.project) city.project.progress = (city.project.progress || 0) + 10;
      const civ = Game.getCiv(unit.civId);
      if (civ && civ.isPlayer) Notify.push("Forest removed." + (city && city.project ? " +10 production toward project." : ""));
      if (unit.charges <= 0){
        if (civ && civ.isPlayer) Notify.push("Builder exhausted its charges.");
        Game.removeUnit(unit.id);
      }
      if (city) Citizens.autoAssign(city);
      return true;
    }
    if (!this.canBuild(unit, unit.col, unit.row, improvementId)) return false;
    const tile = Game.world.grid[unit.row][unit.col];
    tile.improvement = improvementId;
    unit.charges -= 1;
    unit.moves = 0;
    const def = IMPROVEMENTS[improvementId];
    let where = "";
    let nearest = null, bestD = 99;
    for (const c of Game.cities){
      const d = HexGrid.distance(c.col, c.row, unit.col, unit.row);
      if (d < bestD){ bestD = d; nearest = c; }
    }
    if (nearest) where = " near " + nearest.name;
    const _uciv = Game.getCiv(unit.civId);
    if (_uciv && _uciv.isPlayer){
      Notify.push((def ? def.name : improvementId) + " constructed" + where + ".");
      if (unit.charges <= 0) Notify.push("Builder exhausted its charges.");
    }
    if (unit.charges <= 0) Game.removeUnit(unit.id);
    for (const c of Game.cities){
      if (tile.ownerId === c.id) Citizens.autoAssign(c);
    }
    ConnectedResources.recompute();
    return true;
  }
};

const ConnectedResources = {
  recompute(){
    for (const civ of Game.civilizations){
      const lux = new Set();
      const strat = {};
      for (const city of Game.citiesOf(civ.id)){
        const owned = CityTerritory.ownedTiles(city);
        for (const t of owned){
          const tile = Game.world.grid[t.row][t.col];
          if (!tile.resource || !tile.improvement) continue;
          const res = RESOURCES[tile.resource];
          if (!res) continue;
          if (res.improvement && tile.improvement !== res.improvement) continue;
          if (res.category === "LUXURY") lux.add(res.id);
          if (res.category === "STRATEGIC") strat[res.id] = (strat[res.id] || 0) + 1;
        }
      }
      civ.luxuries = Array.from(lux);
      civ.strategic = strat;
    }
    Game.syncCivAlias();
  }
};

/* ---------------------------------------------------------------------------
   5h. NOTIFICATIONS
--------------------------------------------------------------------------- */
const Notify = {
  queue: [],
  push(msg){
    this.queue.push({ id: Date.now() + Math.random(), text: msg, t: Date.now() });
    this.render();
    setTimeout(() => this.dismissOldest(), 5500);
  },
  dismissOldest(){
    if (this.queue.length) this.queue.shift();
    this.render();
  },
  dismiss(id){
    this.queue = this.queue.filter(n => n.id !== id);
    this.render();
  },
  render(){
    let box = document.getElementById("notify-box");
    if (!box) return;
    box.innerHTML = "";
    this.queue.slice(-4).forEach(n => {
      const el = document.createElement("div");
      el.className = "notify-item";
      el.innerHTML = `<span>${n.text}</span><button class="notify-x" data-id="${n.id}">x</button>`;
      box.appendChild(el);
      el.querySelector(".notify-x").addEventListener("click", () => this.dismiss(n.id));
    });
  }
};

/* ---------------------------------------------------------------------------
   6. MOVEMENT / PATHFINDING
--------------------------------------------------------------------------- */
const Movement = {
  /* Returns { reachable: [{col,row,cost}], paths: { "c,r": [{col,row},...] } } */
  compute(unit){
    const world = Game.world;
    const startKey = unit.col + "," + unit.row;
    const costSoFar = { [startKey]: 0 };
    const cameFrom = { [startKey]: null };
    const frontier = [{ col: unit.col, row: unit.row, cost: 0 }];

    while (frontier.length){
      frontier.sort((a, b) => a.cost - b.cost);
      const current = frontier.shift();
      const neighbors = HexGrid.neighbors(current.col, current.row);
      for (const n of neighbors){
        if (n.col < 0 || n.row < 0 || n.col >= world.w || n.row >= world.h) continue;
        const tile = world.grid[n.row][n.col];
        const terrainDef = TERRAIN[tile.terrain];
        if (!terrainDef.passable) continue;
        // Block occupied tiles (other units) from being destinations, but allow pathing through empty
        const stepCost = terrainDef.cost;
        const newCost = current.cost + stepCost;
        if (newCost > unit.moves) continue;
        const key = n.col + "," + n.row;
        if (!(key in costSoFar) || newCost < costSoFar[key]){
          costSoFar[key] = newCost;
          cameFrom[key] = { col: current.col, row: current.row };
          frontier.push({ col: n.col, row: n.row, cost: newCost });
        }
      }
    }
    const reachable = [];
    const paths = {};
    for (const key of Object.keys(costSoFar)){
      if (key === startKey) continue;
      const [col, row] = key.split(",").map(Number);
      // Cannot end move on another unit
      if (Game.unitAt(col, row)) continue;
      reachable.push({ col, row, cost: costSoFar[key] });
      // Reconstruct path
      const path = [];
      let cur = key;
      while (cur && cur !== startKey){
        const [c, r] = cur.split(",").map(Number);
        path.push({ col: c, row: r });
        const prev = cameFrom[cur];
        cur = prev ? (prev.col + "," + prev.row) : null;
      }
      path.reverse();
      paths[key] = path;
    }
    return { reachable, paths };
  },
  reachableTiles(unit){
    return this.compute(unit).reachable;
  }
};


/* ---------------------------------------------------------------------------
   6b. DIPLOMACY
--------------------------------------------------------------------------- */
const Diplomacy = {
  key(a, b){
    const x = Math.min(a, b), y = Math.max(a, b);
    return x + "|" + y;
  },
  get(a, b){
    if (a === b) return "PEACE";
    if (a === CONFIG.BARBARIAN_CIV_ID || b === CONFIG.BARBARIAN_CIV_ID) return "WAR";
    return Game.diplomacy[this.key(a, b)] || "UNKNOWN";
  },
  set(a, b, state){
    if (a === b) return;
    if (a === CONFIG.BARBARIAN_CIV_ID || b === CONFIG.BARBARIAN_CIV_ID) return;
    Game.diplomacy[this.key(a, b)] = state;
  },
  meet(a, b){
    if (a === b) return;
    const cur = this.get(a, b);
    if (cur === "UNKNOWN") this.set(a, b, "PEACE");
  },
  atWar(a, b){
    return this.get(a, b) === "WAR";
  },
  declareWar(a, b, silent){
    if (a === b) return;
    this.set(a, b, "WAR");
    if (!silent){
      const ca = Game.getCiv(a), cb = Game.getCiv(b);
      const an = ca ? ca.name : "A civilization";
      const bn = cb ? cb.name : "another civilization";
      if (a === Game.playerCivId) Notify.push("You declared war on " + bn + "!");
      else if (b === Game.playerCivId) Notify.push(an + " has declared war on you!");
      else Notify.push(an + " and " + bn + " are at war.");
    }
  },
  canAttack(attackerCivId, defenderCivId){
    if (attackerCivId === defenderCivId) return false;
    if (attackerCivId === CONFIG.BARBARIAN_CIV_ID || defenderCivId === CONFIG.BARBARIAN_CIV_ID) return true;
    return this.atWar(attackerCivId, defenderCivId);
  }
};

/* ---------------------------------------------------------------------------
   6c. COMBAT
--------------------------------------------------------------------------- */
const Combat = {
  isMilitary(unit){
    if (!unit) return false;
    const def = UNIT_DEFS[unit.type];
    return def && !def.civilian && (unit.combatStrength > 0 || (def.combatStrength || 0) > 0);
  },
  isCivilian(unit){
    const def = UNIT_DEFS[unit.type];
    return def && def.civilian;
  },
  strength(unit){
    if (!unit) return 0;
    let s = unit.combatStrength || (UNIT_DEFS[unit.type] && UNIT_DEFS[unit.type].combatStrength) || 0;
    // Damaged units fight weaker
    if (unit.maxHealth > 0 && unit.health < unit.maxHealth){
      s *= 0.5 + 0.5 * (unit.health / unit.maxHealth);
    }
    // Fortified units gain defensive strength
    if (unit.stance === "FORTIFY") s *= 1.35;
    return s;
  },
  terrainDefenseBonus(col, row){
    const tile = Game.world.grid[row][col];
    if (!tile) return 0;
    if (tile.terrain === "HILLS" || tile.terrain === "FOREST") return 3;
    return 0;
  },
  cityDefense(city){
    let d = city.defenseStrength || CONFIG.CITY_BASE_DEFENSE;
    d += Math.floor((city.population || 1) * 2);
    if (city.buildings && city.buildings.includes("MONUMENT")) d += 2;
    // Encampment bonus
    if (Districts.completedOfType(city.id, "ENCAMPMENT")) d += 8;
    return d;
  },
  /* Approximate damage for preview (no RNG) */
  predictDamage(atkStr, defStr){
    if (defStr <= 0) return 60;
    const ratio = atkStr / defStr;
    // Civ-like: roughly 30 base when equal, scales with strength ratio
    let dmg = 30 * Math.pow(ratio, 0.9);
    return Math.max(8, Math.min(70, Math.round(dmg)));
  },
  calculateDamage(atkStr, defStr){
    const base = this.predictDamage(atkStr, defStr);
    const variance = Math.floor(Math.random() * 7) - 3; // -3..+3
    return Math.max(5, base + variance);
  },
  canUnitAttack(attacker, targetUnit){
    if (!attacker || !targetUnit) return false;
    if (!this.isMilitary(attacker)) return false;
    if (attacker.hasAttacked) return false;
    if (attacker.moves <= 0 && !attacker.hasAttacked) {
      // allow attack with 0 moves if they still haven't attacked? Civ usually needs move point
    }
    if (attacker.moves <= 0) return false;
    if (attacker.civId === targetUnit.civId) return false;
    if (!Diplomacy.canAttack(attacker.civId, targetUnit.civId)) return false;
    const dist = HexGrid.distance(attacker.col, attacker.row, targetUnit.col, targetUnit.row);
    return dist === 1; // melee adjacent
  },
  canAttackCity(attacker, city){
    if (!attacker || !city) return false;
    if (!this.isMilitary(attacker)) return false;
    if (attacker.hasAttacked || attacker.moves <= 0) return false;
    if (attacker.civId === city.civId) return false;
    if (!Diplomacy.canAttack(attacker.civId, city.civId)) return false;
    return HexGrid.distance(attacker.col, attacker.row, city.col, city.row) === 1;
  },
  attackTargets(attacker){
    const targets = [];
    if (!attacker || !this.isMilitary(attacker) || attacker.hasAttacked || attacker.moves <= 0) return targets;
    const neighbors = HexGrid.neighbors(attacker.col, attacker.row);
    for (const n of neighbors){
      if (n.col < 0 || n.row < 0 || n.col >= Game.world.w || n.row >= Game.world.h) continue;
      const u = Game.unitAt(n.col, n.row);
      if (u && this.canUnitAttack(attacker, u)) targets.push({ type: "UNIT", unit: u, col: n.col, row: n.row });
      const c = Game.cityAt(n.col, n.row);
      if (c && this.canAttackCity(attacker, c)) targets.push({ type: "CITY", city: c, col: n.col, row: n.row });
      // Barb camp on tile
      const camp = Barbarians.campAt(n.col, n.row);
      if (camp && attacker.civId !== CONFIG.BARBARIAN_CIV_ID) targets.push({ type: "CAMP", camp, col: n.col, row: n.row });
    }
    return targets;
  },
  attackUnit(attacker, defender){
    if (!this.canUnitAttack(attacker, defender)) return null;
    if (typeof UnitOrders !== "undefined") UnitOrders.clearStance(attacker);
    // Capture civilians
    if (this.isCivilian(defender)){
      defender.civId = attacker.civId;
      const civ = Game.getCiv(attacker.civId);
      defender.civColor = civ ? civ.color : attacker.civColor;
      attacker.hasAttacked = true;
      attacker.moves = 0;
      const an = unitTypeName(attacker.type);
      const dn = unitTypeName(defender.type);
      if (attacker.civId === Game.playerCivId) Notify.push("Your " + an + " captured an enemy " + dn + ".");
      else if (defender.civId === Game.playerCivId || true) {
        if (Game.discoveredCivs[attacker.civId] || attacker.civId === Game.playerCivId)
          Notify.push("A " + dn + " was captured.");
      }
      return { captured: true };
    }
    const aStr = this.strength(attacker);
    const dStr = this.strength(defender) + this.terrainDefenseBonus(defender.col, defender.row);
    const dmgToDef = this.calculateDamage(aStr, dStr);
    const dmgToAtk = this.calculateDamage(dStr * 0.85, aStr); // defender counter
    defender.health = Math.max(0, (defender.health || defender.maxHealth) - dmgToDef);
    attacker.health = Math.max(0, (attacker.health || attacker.maxHealth) - dmgToAtk);
    attacker.hasAttacked = true;
    attacker.moves = 0;
    attacker.turnComplete = true;

    const result = { dmgToDef, dmgToAtk, defenderDied: false, attackerDied: false };
    if (defender.health <= 0){
      result.defenderDied = true;
      const name = unitTypeName(defender.type);
      if (attacker.civId === Game.playerCivId) Notify.push("Your " + unitTypeName(attacker.type) + " defeated a " + name + ".");
      else if (defender.civId === Game.playerCivId) Notify.push("Your " + name + " was defeated.");
      Game.removeUnit(defender.id);
    }
    if (attacker.health <= 0){
      result.attackerDied = true;
      if (attacker.civId === Game.playerCivId) Notify.push("Your " + unitTypeName(attacker.type) + " was defeated.");
      Game.removeUnit(attacker.id);
    }
    return result;
  },
  attackCity(attacker, city){
    if (!this.canAttackCity(attacker, city)) return null;
    if (typeof UnitOrders !== "undefined") UnitOrders.clearStance(attacker);
    const aStr = this.strength(attacker);
    const cDef = this.cityDefense(city) + this.terrainDefenseBonus(city.col, city.row);
    const dmgToCity = this.calculateDamage(aStr, cDef);
    const dmgToAtk = this.calculateDamage(cDef * 0.7, aStr);
    city.health = Math.max(0, (city.health || city.maxHealth) - dmgToCity);
    attacker.health = Math.max(0, (attacker.health || attacker.maxHealth) - dmgToAtk);
    attacker.hasAttacked = true;
    attacker.moves = 0;
    attacker.turnComplete = true;
    if (attacker.civId === Game.playerCivId){
      Notify.push("Attacked " + city.name + " for " + dmgToCity + " damage.");
    }
    if (attacker.health <= 0){
      if (attacker.civId === Game.playerCivId) Notify.push("Your " + unitTypeName(attacker.type) + " was defeated.");
      Game.removeUnit(attacker.id);
      return { cityCaptured: false };
    }
    if (city.health <= 0){
      this.captureCity(city, attacker.civId);
      return { cityCaptured: true };
    }
    return { cityCaptured: false, dmgToCity, dmgToAtk };
  },
  captureCity(city, newCivId){
    const oldCiv = Game.getCiv(city.civId);
    const newCiv = Game.getCiv(newCivId);
    const oldName = oldCiv ? oldCiv.name : "a civilization";
    const newName = newCiv ? newCiv.name : "a civilization";
    city.civId = newCivId;
    city.civColor = newCiv ? newCiv.color : "#888";
    city.health = Math.floor((city.maxHealth || CONFIG.CITY_MAX_HP) * 0.5);
    city.project = null;
    // Transfer districts
    for (const d of Game.districts){
      if (d.cityId === city.id) d.civId = newCivId;
    }
    // Reclaim territory ownership
    for (let row = 0; row < Game.world.h; row++){
      for (let col = 0; col < Game.world.w; col++){
        const t = Game.world.grid[row][col];
        if (t.ownerId === city.id) { /* owner is city id already */ }
      }
    }
    Citizens.autoAssign(city);
    ConnectedResources.recompute();
    FogOfWar.recompute();
    if (newCivId === Game.playerCivId) Notify.push("You captured " + city.name + "!");
    else if (city.civId === Game.playerCivId || oldCiv && oldCiv.isPlayer)
      Notify.push(newName + " has captured " + city.name + "!");
    else Notify.push(newName + " captured " + city.name + ".");
  },
  attackCamp(attacker, camp){
    if (!camp || attacker.hasAttacked || attacker.moves <= 0) return null;
    if (!this.isMilitary(attacker)) return null;
    // Destroy camp if adjacent
    if (HexGrid.distance(attacker.col, attacker.row, camp.col, camp.row) !== 1) return null;
    // Optional: need to clear defending barb on camp tile first
    const def = Game.unitAt(camp.col, camp.row);
    if (def && def.civId === CONFIG.BARBARIAN_CIV_ID){
      return this.attackUnit(attacker, def);
    }
    Barbarians.destroyCamp(camp, attacker.civId);
    attacker.hasAttacked = true;
    attacker.moves = 0;
    return { campDestroyed: true };
  }
};

/* ---------------------------------------------------------------------------
   6d. BARBARIANS
--------------------------------------------------------------------------- */
const Barbarians = {
  campAt(col, row){
    return Game.barbarianCamps.find(c => c.col === col && c.row === row) || null;
  },
  generateCamps(world, avoidSpots){
    Game.barbarianCamps = [];
    const rng = mulberry32((world.seed || 1) ^ 0xB0B0);
    const target = Math.max(2, Math.floor((world.w * world.h) / 450));
    let placed = 0, attempts = 0;
    while (placed < target && attempts < target * 40){
      attempts++;
      const col = 1 + Math.floor(rng() * (world.w - 2));
      const row = 1 + Math.floor(rng() * (world.h - 2));
      const tile = world.grid[row][col];
      if (!TERRAIN[tile.terrain].passable) continue;
      if (tile.terrain === "COAST") continue;
      let nearStart = false;
      for (const s of avoidSpots){
        if (HexGrid.distance(col, row, s.col, s.row) < 7){ nearStart = true; break; }
      }
      if (nearStart) continue;
      if (this.campAt(col, row)) continue;
      let nearCamp = false;
      for (const c of Game.barbarianCamps){
        if (HexGrid.distance(col, row, c.col, c.row) < 6){ nearCamp = true; break; }
      }
      if (nearCamp) continue;
      Game.barbarianCamps.push({
        id: Game.nextCampId++,
        col, row,
        spawnTimer: 3 + Math.floor(rng() * 4)
      });
      placed++;
    }
  },
  destroyCamp(camp, byCivId){
    Game.barbarianCamps = Game.barbarianCamps.filter(c => c.id !== camp.id);
    // Remove barb units on camp tile
    const u = Game.unitAt(camp.col, camp.row);
    if (u && u.civId === CONFIG.BARBARIAN_CIV_ID) Game.removeUnit(u.id);
    const reward = 25;
    const civ = Game.getCiv(byCivId);
    if (civ){
      civ.gold += reward;
      if (civ.isPlayer){
        Game.syncCivAlias();
        Notify.push("Barbarian Camp destroyed! +" + reward + " Gold");
      }
    }
  },
  processTurn(){
    for (const camp of Game.barbarianCamps.slice()){
      camp.spawnTimer = (camp.spawnTimer || 4) - 1;
      if (camp.spawnTimer > 0) continue;
      camp.spawnTimer = 5 + Math.floor(Math.random() * 4);
      // Spawn if not overcrowded
      const nearbyBarbs = Game.units.filter(u =>
        u.civId === CONFIG.BARBARIAN_CIV_ID &&
        HexGrid.distance(u.col, u.row, camp.col, camp.row) <= 3
      ).length;
      if (nearbyBarbs >= 3) continue;
      const neighbors = HexGrid.neighbors(camp.col, camp.row);
      neighbors.push({ col: camp.col, row: camp.row });
      let spawned = false;
      for (const n of neighbors){
        if (n.col < 0 || n.row < 0 || n.col >= Game.world.w || n.row >= Game.world.h) continue;
        const t = Game.world.grid[n.row][n.col];
        if (!TERRAIN[t.terrain].passable) continue;
        if (Game.unitAt(n.col, n.row)) continue;
        if (Game.cityAt(n.col, n.row)) continue;
        Game.addUnit("BARBARIAN_WARRIOR", n.col, n.row, CONFIG.BARBARIAN_CIV_ID);
        spawned = true;
        break;
      }
    }
    // Barb unit AI
    for (const u of Game.units.filter(x => x.civId === CONFIG.BARBARIAN_CIV_ID && x.moves > 0)){
      this.runBarbUnit(u);
    }
  },
  runBarbUnit(unit){
    // Find nearest non-barb military or civilian or city
    let best = null, bestD = 99, bestKind = null;
    for (const o of Game.units){
      if (o.civId === CONFIG.BARBARIAN_CIV_ID) continue;
      const d = HexGrid.distance(unit.col, unit.row, o.col, o.row);
      if (d < bestD){ bestD = d; best = o; bestKind = "UNIT"; }
    }
    for (const c of Game.cities){
      const d = HexGrid.distance(unit.col, unit.row, c.col, c.row);
      if (d < bestD){ bestD = d; best = c; bestKind = "CITY"; }
    }
    if (!best || bestD > 10){
      // Wander near nearest camp
      const camp = Game.barbarianCamps[0];
      if (camp) AI.moveToward(unit, camp.col, camp.row);
      else AI.wander(unit, null);
      return;
    }
    if (bestKind === "UNIT" && Combat.canUnitAttack(unit, best)){
      Combat.attackUnit(unit, best);
      return;
    }
    if (bestKind === "CITY" && Combat.canAttackCity(unit, best)){
      Combat.attackCity(unit, best);
      return;
    }
    AI.moveToward(unit, best.col, best.row);
  },
  drawCamp(cx, cy, size){
    ctx.save();
    ctx.translate(cx, cy);
    // First-version warning plate + tents
    drawXpIconPlate(0, 0, size * 0.36, "#f0a080", "#a04030");
    for (let i = -1; i <= 1; i++){
      ctx.fillStyle = i === 0 ? "#fff0d0" : "#e8d0a0";
      ctx.beginPath();
      ctx.moveTo(i * size * 0.18, size * 0.14);
      ctx.lineTo(i * size * 0.18 - size * 0.12, size * 0.14);
      ctx.lineTo(i * size * 0.18, -size * 0.14);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = i === 0 ? "#e0c080" : "#c0a060";
      ctx.beginPath();
      ctx.moveTo(i * size * 0.18, size * 0.14);
      ctx.lineTo(i * size * 0.18 + size * 0.12, size * 0.14);
      ctx.lineTo(i * size * 0.18, -size * 0.14);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }
};

/* ---------------------------------------------------------------------------
   7. CAMERA / RENDERING
--------------------------------------------------------------------------- */
const canvas = document.getElementById("map-canvas");
const ctx = canvas.getContext("2d");
let dpr = Math.max(1, window.devicePixelRatio || 1);
/* reachableCache / pathCache declared with Selection system */

function resizeCanvas(){
  dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
}
window.addEventListener("resize", () => { resizeCanvas(); render(); });

function worldPixelSize(){
  const size = CONFIG.HEX_SIZE;
  const w = Game.world.w, h = Game.world.h;
  const width = size * Math.sqrt(3) * (w + 0.5);
  const height = size * 1.5 * (h) + size;
  return { width, height };
}

function centerCameraOnStart(col, row){
  const p = HexGrid.offsetToPixel(col, row, CONFIG.HEX_SIZE);
  Game.camera.x = window.innerWidth / 2 - p.x * Game.camera.zoom;
  Game.camera.y = window.innerHeight / 2 - p.y * Game.camera.zoom;
}

function drawHexPath(cx, cy, size){
  ctx.beginPath();
  for (let i = 0; i < 6; i++){
    const pt = HexGrid.cornerPoint(cx, cy, size, i);
    if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
  }
  ctx.closePath();
}

function shadeColor(hex, amt){
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + amt, g = ((num >> 8) & 0xff) + amt, b = (num & 0xff) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return "rgb(" + r + "," + g + "," + b + ")";
}
function hexToRgba(hex, alpha){
  const num = parseInt(hex.slice(1), 16);
  const r = (num >> 16) & 0xff, g = (num >> 8) & 0xff, b = num & 0xff;
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}

/* Unit badge — first-version XP glossy disc */
function drawUnitToken(cx, cy, size, color){
  const r = size * 0.38;
  ctx.beginPath();
  ctx.ellipse(cx, cy + r * 0.85, r * 0.9, r * 0.28, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.fill();
  const g = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
  g.addColorStop(0, shadeColor(color, 55));
  g.addColorStop(0.45, color);
  g.addColorStop(1, shadeColor(color, -40));
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = shadeColor(color, -55);
  ctx.lineWidth = size * 0.05;
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(cx - r * 0.15, cy - r * 0.35, r * 0.55, r * 0.28, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.fill();
}

/* XP glossy rounded-square icon plate (resources / improvements / camps) */
function drawXpIconPlate(cx, cy, s, topColor, botColor){
  const half = s * 0.95;
  const r = s * 0.22;
  ctx.beginPath();
  ctx.moveTo(cx - half + r, cy - half);
  ctx.lineTo(cx + half - r, cy - half);
  ctx.quadraticCurveTo(cx + half, cy - half, cx + half, cy - half + r);
  ctx.lineTo(cx + half, cy + half - r);
  ctx.quadraticCurveTo(cx + half, cy + half, cx + half - r, cy + half);
  ctx.lineTo(cx - half + r, cy + half);
  ctx.quadraticCurveTo(cx - half, cy + half, cx - half, cy + half - r);
  ctx.lineTo(cx - half, cy - half + r);
  ctx.quadraticCurveTo(cx - half, cy - half, cx - half + r, cy - half);
  ctx.closePath();
  const g = ctx.createLinearGradient(cx, cy - half, cx, cy + half);
  g.addColorStop(0, topColor);
  g.addColorStop(0.55, botColor);
  g.addColorStop(1, shadeColor(botColor, -25));
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.45)";
  ctx.lineWidth = Math.max(1, s * 0.08);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(cx, cy - half * 0.45, half * 0.7, half * 0.22, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.fill();
}

function drawTerrainDetail(tile, cx, cy, size){
  const seed = tile.featureSeed;
  ctx.save();
  drawHexPath(cx, cy, size);
  ctx.clip();
  switch (tile.terrain){
    case "OCEAN":
      ctx.strokeStyle = "rgba(255,255,255,0.20)";
      ctx.lineWidth = Math.max(1, size * 0.05);
      for (let i = -1; i <= 1; i++){
        ctx.beginPath();
        ctx.moveTo(cx - size * 0.7, cy + i * size * 0.35 + (seed % 7));
        ctx.quadraticCurveTo(cx, cy + i * size * 0.35 - size * 0.15 + (seed % 5), cx + size * 0.7, cy + i * size * 0.35 + (seed % 7));
        ctx.stroke();
      }
      break;
    case "COAST":
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = Math.max(1, size * 0.06);
      ctx.beginPath();
      ctx.moveTo(cx - size * 0.6, cy);
      ctx.quadraticCurveTo(cx, cy - size * 0.2, cx + size * 0.6, cy);
      ctx.stroke();
      break;
    case "FOREST": {
      const positions = [[-0.32,-0.15],[0.05,-0.35],[0.32,0.05],[-0.1,0.3],[0.28,-0.35]];
      for (let i = 0; i < positions.length; i++){
        const [ox, oy] = positions[i];
        if (((seed + i * 13) % 5) === 0 && i > 2) continue;
        const tx = cx + ox * size, ty = cy + oy * size;
        ctx.fillStyle = shadeColor("#2c5c30", (i % 2) * 6);
        ctx.beginPath();
        ctx.moveTo(tx, ty - size * 0.32);
        ctx.lineTo(tx - size * 0.16, ty + size * 0.08);
        ctx.lineTo(tx + size * 0.16, ty + size * 0.08);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#5a3a22";
        ctx.fillRect(tx - size * 0.03, ty + size * 0.06, size * 0.06, size * 0.14);
      }
      break;
    }
    case "HILLS":
      ctx.strokeStyle = "rgba(255,255,255,0.28)";
      ctx.lineWidth = Math.max(1, size * 0.05);
      for (let i = 0; i < 2; i++){
        const ox = (i - 0.5) * size * 0.7;
        ctx.beginPath();
        ctx.arc(cx + ox, cy + size * 0.25, size * 0.28, Math.PI, 0);
        ctx.stroke();
      }
      break;
    case "MOUNTAINS":
      for (let i = 0; i < 3; i++){
        const ox = (i - 1) * size * 0.42;
        const h = size * (0.55 + ((seed + i) % 3) * 0.06);
        ctx.fillStyle = i === 1 ? "#75757c" : "#66666d";
        ctx.beginPath();
        ctx.moveTo(cx + ox, cy + size * 0.32);
        ctx.lineTo(cx + ox - size * 0.26, cy + size * 0.32);
        ctx.lineTo(cx + ox, cy - h * 0.55);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.beginPath();
        ctx.moveTo(cx + ox, cy - h * 0.55);
        ctx.lineTo(cx + ox - size * 0.09, cy - h * 0.30);
        ctx.lineTo(cx + ox + size * 0.09, cy - h * 0.30);
        ctx.closePath();
        ctx.fill();
      }
      break;
    case "DESERT":
      ctx.strokeStyle = "rgba(150,110,40,0.35)";
      ctx.lineWidth = Math.max(1, size * 0.045);
      for (let i = -1; i <= 1; i++){
        ctx.beginPath();
        ctx.moveTo(cx - size * 0.55, cy + i * size * 0.3);
        ctx.quadraticCurveTo(cx, cy + i * size * 0.3 + size * 0.12, cx + size * 0.55, cy + i * size * 0.3);
        ctx.stroke();
      }
      break;
    case "PLAINS":
    case "GRASSLAND":
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = Math.max(1, size * 0.035);
      for (let i = 0; i < 3; i++){
        const ox = ((seed + i * 31) % 100) / 100 * size - size / 2;
        ctx.beginPath();
        ctx.moveTo(cx + ox, cy + size * 0.3);
        ctx.lineTo(cx + ox, cy + size * 0.05);
        ctx.stroke();
      }
      break;
  }
  ctx.restore();
}

function drawResourceIcon(cx, cy, size, resourceId){
  const res = RESOURCES[resourceId];
  if (!res) return;
  ctx.save();
  ctx.translate(cx, cy);
  const s = size * 0.28;
  // First-version XP plates by category
  if (res.category === "LUXURY") drawXpIconPlate(0, 0, s, "#ffe8a0", "#e0b040");
  else if (res.category === "STRATEGIC") drawXpIconPlate(0, 0, s, "#c0c8d8", "#687888");
  else drawXpIconPlate(0, 0, s, "#d8f0c0", "#70a848");
  switch (resourceId){
    case "WHEAT": case "RICE":
      ctx.strokeStyle = "#b8942e"; ctx.lineWidth = size * 0.035;
      for (let i = -1; i <= 1; i++){
        ctx.beginPath();
        ctx.moveTo(i * s * 0.32, s * 0.42);
        ctx.lineTo(i * s * 0.12, -s * 0.42);
        ctx.stroke();
      }
      ctx.fillStyle = "#f0d060";
      ctx.beginPath(); ctx.ellipse(-s*0.12, -s*0.38, s*0.14, s*0.1, -0.3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s*0.12, -s*0.28, s*0.12, s*0.09, 0.2, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -s*0.48, s*0.1, s*0.08, 0, 0, Math.PI*2); ctx.fill();
      break;
    case "CATTLE":
      ctx.fillStyle = "#8a7060";
      ctx.beginPath(); ctx.ellipse(0.05*s, 0.12*s, s*0.42, s*0.26, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-0.32*s, -0.12*s, s*0.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#6a5040";
      ctx.beginPath(); ctx.ellipse(-0.42*s, -0.22*s, s*0.08, s*0.05, 0.5, 0, Math.PI*2); ctx.fill();
      break;
    case "SHEEP":
      ctx.fillStyle = "#e8e4dc";
      ctx.beginPath(); ctx.ellipse(0, 0.08*s, s*0.4, s*0.28, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-0.28*s, -0.15*s, s*0.18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#c8c0b0";
      ctx.beginPath(); ctx.arc(-0.38*s, -0.22*s, s*0.07, 0, Math.PI*2); ctx.fill();
      break;
    case "HORSES":
      ctx.fillStyle = "#7a5a28";
      ctx.beginPath(); ctx.ellipse(0.05*s, 0.1*s, s*0.4, s*0.24, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-0.3*s, -0.15*s, s*0.18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#5a4018";
      ctx.beginPath(); ctx.moveTo(-0.4*s, -0.25*s); ctx.lineTo(-0.5*s, -0.4*s); ctx.lineTo(-0.28*s, -0.28*s); ctx.fill();
      break;
    case "DEER":
      ctx.fillStyle = "#7a5030";
      ctx.beginPath(); ctx.ellipse(0.05*s, 0.12*s, s*0.38, s*0.22, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-0.28*s, -0.1*s, s*0.16, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "#5a3820"; ctx.lineWidth = size * 0.03;
      ctx.beginPath(); ctx.moveTo(-0.28*s, -0.22*s); ctx.lineTo(-0.38*s, -0.45*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-0.22*s, -0.22*s); ctx.lineTo(-0.12*s, -0.42*s); ctx.stroke();
      break;
    case "STONE":
      ctx.fillStyle = "#a0a0a8";
      ctx.beginPath();

      ctx.fillRect(-s*0.28, -s*0.22, s*0.18, s*0.08);
      ctx.fillRect(-s*0.05, -s*0.32, s*0.18, s*0.08);
      ctx.fillRect(s*0.18, -s*0.18, s*0.16, s*0.08);
      break;
    default:
      ctx.fillStyle = "#c0a060";
      ctx.beginPath(); ctx.arc(0, 0, s*0.28, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawImprovementIcon(cx, cy, size, improvementId){
  ctx.save();
  ctx.translate(cx, cy);
  const s = size * 0.34;
  // First-version XP plate under improvement glyph
  drawXpIconPlate(0, 0, s * 0.85, "#f8f4e8", "#d0c8b0");
  switch (improvementId){
    case "FARM":
      ctx.strokeStyle = "#8a7030"; ctx.lineWidth = size * 0.035;
      for (let i = -2; i <= 2; i++){
        ctx.beginPath();
        ctx.moveTo(-s*0.55, i * s * 0.18);
        ctx.lineTo(s*0.55, i * s * 0.18);
        ctx.stroke();
      }
      ctx.fillStyle = "#5a9a30";
      for (let i = -2; i <= 2; i++){
        ctx.beginPath(); ctx.arc(i * s * 0.22, -s * 0.05, s * 0.07, 0, Math.PI*2); ctx.fill();
      }
      break;
    case "MINE":
      ctx.fillStyle = "#5a5048";
      ctx.beginPath();
      ctx.moveTo(-s*0.55, s*0.35); ctx.lineTo(-s*0.2, -s*0.25); ctx.lineTo(s*0.4, s*0.35);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#2a2520";
      ctx.beginPath(); ctx.arc(0, s*0.18, s*0.2, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = "#8a8070"; ctx.lineWidth = size * 0.03;
      ctx.beginPath(); ctx.moveTo(-s*0.15, -s*0.1); ctx.lineTo(s*0.25, s*0.15); ctx.stroke();
      break;
    case "QUARRY":
      ctx.fillStyle = "#9a9aa2";
      ctx.fillRect(-s*0.55, -s*0.1, s*0.38, s*0.5);
      ctx.fillStyle = "#7a7a82";
      ctx.fillRect(-s*0.08, -s*0.32, s*0.42, s*0.72);
      ctx.fillStyle = "#b0b0b8";
      ctx.fillRect(s*0.2, 0.05*s, s*0.32, s*0.38);
      ctx.strokeStyle = "#5a5a62"; ctx.lineWidth = size * 0.02;
      ctx.strokeRect(-s*0.55, -s*0.1, s*0.38, s*0.5);
      ctx.strokeRect(-s*0.08, -s*0.32, s*0.42, s*0.72);
      break;
    case "PASTURE":
      ctx.strokeStyle = "#6a5030"; ctx.lineWidth = size * 0.045;
      ctx.strokeRect(-s*0.55, -s*0.4, s*1.1, s*0.85);
      ctx.beginPath(); ctx.moveTo(-s*0.55, 0); ctx.lineTo(s*0.55, 0); ctx.stroke();
      // fence posts
      for (let i = -1; i <= 1; i++){
        ctx.fillStyle = "#8a6a40";
        ctx.fillRect(i * s * 0.35 - s*0.04, -s*0.42, s*0.08, s*0.2);
      }
      break;
    case "PLANTATION":
      for (let i = -1; i <= 1; i++){
        ctx.fillStyle = "#2d6a28";
        ctx.beginPath();
        ctx.moveTo(i*s*0.35, s*0.38);
        ctx.lineTo(i*s*0.35 - s*0.14, -s*0.05);
        ctx.lineTo(i*s*0.35 + s*0.14, -s*0.05);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#4a9a3a";
        ctx.beginPath(); ctx.arc(i*s*0.35, -s*0.12, s*0.12, 0, Math.PI*2); ctx.fill();
      }
      break;
    case "CAMP":
      ctx.fillStyle = "#8b5a2b";
      ctx.beginPath();
      ctx.moveTo(0, -s*0.48); ctx.lineTo(-s*0.42, s*0.28); ctx.lineTo(s*0.42, s*0.28);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#6a4020";
      ctx.fillRect(-s*0.08, s*0.05, s*0.16, s*0.22);
      break;
    case "FISHING_BOATS":
      ctx.fillStyle = "#c8b090";
      ctx.beginPath();
      ctx.moveTo(-s*0.5, s*0.12); ctx.lineTo(s*0.48, s*0.12); ctx.lineTo(s*0.28, s*0.38); ctx.lineTo(-s*0.42, s*0.38);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "#5a4030"; ctx.lineWidth = size*0.035;
      ctx.beginPath(); ctx.moveTo(0, s*0.12); ctx.lineTo(0, -s*0.42); ctx.stroke();
      ctx.fillStyle = "rgba(240,240,255,0.7)";
      ctx.beginPath();
      ctx.moveTo(0, -s*0.4); ctx.lineTo(s*0.28, -s*0.05); ctx.lineTo(0, -s*0.05);
      ctx.closePath(); ctx.fill();
      break;
  }
  ctx.restore();
}

function drawDistrictGlyph(cx, cy, size, district){
  const completed = district.state === "COMPLETED";
  const buildings = district.buildings || [];
  ctx.save();
  ctx.translate(cx, cy);
  // First-version XP rounded tile
  if (completed) drawXpIconPlate(0, 0, size * 0.38, "#f0f4fc", "#8aa0c8");
  else drawXpIconPlate(0, 0, size * 0.38, "#fff8e0", "#c0a040");
  if (!completed){
    ctx.strokeStyle = "rgba(120,80,0,0.7)";
    ctx.lineWidth = size * 0.04;
    ctx.strokeRect(-size * 0.2, -size * 0.2, size * 0.4, size * 0.4);
    ctx.restore();
    return;
  }
  switch (district.type){
    case "CAMPUS":
      ctx.fillStyle = "#fff";
      ctx.fillRect(-size * 0.16, -size * 0.04, size * 0.32, size * 0.2);
      ctx.fillStyle = "#4a6a9a";
      ctx.beginPath();
      ctx.moveTo(-size * 0.2, -size * 0.04);
      ctx.lineTo(0, -size * 0.26);
      ctx.lineTo(size * 0.2, -size * 0.04);
      ctx.closePath(); ctx.fill();
      if (buildings.includes("LIBRARY")){
        ctx.fillStyle = "#2a4a78";
        ctx.fillRect(-size * 0.1, size * 0.02, size * 0.07, size * 0.1);
        ctx.fillRect(size * 0.03, size * 0.02, size * 0.07, size * 0.1);
      }
      break;
    case "COMMERCIAL_HUB":
      ctx.fillStyle = "#e8c860";
      ctx.fillRect(-size * 0.2, 0, size * 0.4, size * 0.16);
      ctx.fillStyle = "#c04030";
      ctx.beginPath();
      ctx.moveTo(-size * 0.22, 0);
      ctx.lineTo(0, -size * 0.2);
      ctx.lineTo(size * 0.22, 0);
      ctx.closePath(); ctx.fill();
      break;
    case "INDUSTRIAL_ZONE":
      ctx.fillStyle = "#6a6a78";
      ctx.fillRect(-size * 0.2, 0, size * 0.4, size * 0.16);
      ctx.fillStyle = "#4a4a58";
      ctx.fillRect(-size * 0.14, -size * 0.2, size * 0.1, size * 0.2);
      ctx.fillRect(size * 0.04, -size * 0.26, size * 0.1, size * 0.26);
      break;
    case "ENCAMPMENT":
      ctx.fillStyle = "#8a6a40";
      ctx.fillRect(-size * 0.22, 0, size * 0.44, size * 0.16);
      ctx.strokeStyle = "#4a3020";
      ctx.lineWidth = size * 0.03;
      ctx.strokeRect(-size * 0.22, 0, size * 0.44, size * 0.16);
      ctx.fillStyle = "#c04030";
      ctx.fillRect(-size * 0.04, -size * 0.22, size * 0.08, size * 0.22);
      break;
    default:
      ctx.fillStyle = "#8090a8";
      ctx.fillRect(-size * 0.12, -size * 0.12, size * 0.24, size * 0.24);
  }
  ctx.restore();
}

function drawPathPreview(){
  if (!hoverPath || !hoverPath.length) return;
  const size = CONFIG.HEX_SIZE;
  const unit = Game.getUnit(Game.selectedUnitId);
  if (!unit) return;
  ctx.save();
  const pts = [{ col: unit.col, row: unit.row }, ...hoverPath];
  // Dark outline + yellow path (selection mix)
  ctx.strokeStyle = "rgba(20,40,80,0.55)";
  ctx.lineWidth = 4;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++){
    const p = HexGrid.offsetToPixel(pts[i].col, pts[i].row, size);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,220,50,0.95)";
  ctx.lineWidth = 2.3;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++){
    const p = HexGrid.offsetToPixel(pts[i].col, pts[i].row, size);
    if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  for (let i = 0; i < pts.length; i++){
    const p = HexGrid.offsetToPixel(pts[i].col, pts[i].row, size);
    const r = i === pts.length - 1 ? size * 0.12 : size * 0.07;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    const g = ctx.createLinearGradient(p.x, p.y - r, p.x, p.y + r);
    g.addColorStop(0, "#fff6a8");
    g.addColorStop(1, "#e0b028");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = "rgba(30,40,70,0.55)";
    ctx.lineWidth = 1.1;
    ctx.stroke();
  }
  ctx.restore();
}

function render(){
  if (!Game.world) return;
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Mix: Luna taskbar blue, slightly deeper for map contrast
  ctx.fillStyle = "#1e56a0";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  ctx.translate(Game.camera.x, Game.camera.y);
  ctx.scale(Game.camera.zoom, Game.camera.zoom);

  const size = CONFIG.HEX_SIZE;
  const world = Game.world;
  const reachableSet = new Set(reachableCache.map(t => t.col + "," + t.row));

  for (let row = 0; row < world.h; row++){
    for (let col = 0; col < world.w; col++){
      const tile = world.grid[row][col];
      const p = HexGrid.offsetToPixel(col, row, size);

      // simple culling
      const screenX = p.x * Game.camera.zoom + Game.camera.x;
      const screenY = p.y * Game.camera.zoom + Game.camera.y;
      if (screenX < -size * 3 || screenX > window.innerWidth + size * 3 ||
          screenY < -size * 3 || screenY > window.innerHeight + size * 3) continue;

      if (tile.fog === 0){
        drawHexPath(p.x, p.y, size);
        const fogG = ctx.createLinearGradient(p.x, p.y - size, p.x, p.y + size);
        fogG.addColorStop(0, "#2a4878");
        fogG.addColorStop(1, "#152848");
        ctx.fillStyle = fogG;
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.06)";
        ctx.lineWidth = 1;
        ctx.stroke();
        continue;
      }

      const terrainDef = TERRAIN[tile.terrain];
      // Mix: mild Luna gloss + readable base
      drawHexPath(p.x, p.y, size);
      const grad = ctx.createLinearGradient(p.x, p.y - size, p.x, p.y + size);
      grad.addColorStop(0, shadeColor(terrainDef.base, 24));
      grad.addColorStop(0.45, terrainDef.base);
      grad.addColorStop(1, shadeColor(terrainDef.base, -18));
      ctx.fillStyle = grad;
      ctx.fill();
      // Soft top highlight (not full specular wash)
      ctx.save();
      drawHexPath(p.x, p.y, size * 0.94);
      ctx.clip();
      const hi = ctx.createLinearGradient(p.x, p.y - size, p.x, p.y);
      hi.addColorStop(0, "rgba(255,255,255,0.18)");
      hi.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = hi;
      ctx.fillRect(p.x - size, p.y - size, size * 2, size * 0.9);
      ctx.restore();

      if (Game.settings.showIcons) drawTerrainDetail(tile, p.x, p.y, size);

      // Territory tint + border with light rim
      if (tile.ownerId != null && tile.fog > 0){
        const ownerCity = Game.getCity(tile.ownerId);
        if (ownerCity){
          drawHexPath(p.x, p.y, size);
          ctx.fillStyle = hexToRgba(ownerCity.civColor, 0.16);
          ctx.fill();
          const neighbors = HexGrid.neighbors(col, row);
          for (let i = 0; i < 6; i++){
            const n = neighbors[i];
            let edgeOwned = false;
            if (n.col >= 0 && n.row >= 0 && n.col < world.w && n.row < world.h){
              edgeOwned = world.grid[n.row][n.col].ownerId === tile.ownerId;
            }
            if (!edgeOwned){
              const c1 = HexGrid.cornerPoint(p.x, p.y, size, i);
              const c2 = HexGrid.cornerPoint(p.x, p.y, size, (i + 1) % 6);
              ctx.beginPath();
              ctx.moveTo(c1.x, c1.y);
              ctx.lineTo(c2.x, c2.y);
              ctx.strokeStyle = hexToRgba(ownerCity.civColor, 0.92);
              ctx.lineWidth = 2.4;
              ctx.lineCap = "round";
              ctx.stroke();
              ctx.beginPath();
              ctx.moveTo(c1.x, c1.y);
              ctx.lineTo(c2.x, c2.y);
              ctx.strokeStyle = "rgba(255,255,255,0.22)";
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }
      }

      if (tile.fog > 0){
        if (tile.improvement) drawImprovementIcon(p.x, p.y, size, tile.improvement);
        if (tile.resource && tile.fog === 2){
          const rdef = RESOURCES[tile.resource];
          const revealed = !rdef || !rdef.revealTech || (Game.civ && TechSystem.has(Game.civ, rdef.revealTech));
          if (revealed) drawResourceIcon(p.x, p.y - size * 0.12, size, tile.resource);
        }
      }

      // Worked tile: small marker
      if (tile.fog === 2 && Citizens.isWorked(col, row)){
        ctx.beginPath();
        ctx.arc(p.x, p.y + size * 0.2, size * 0.09, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255,0.88)";
        ctx.fill();
        ctx.strokeStyle = "rgba(20,40,70,0.55)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      drawHexPath(p.x, p.y, size);
      ctx.strokeStyle = Game.settings.showGrid ? "rgba(10,25,50,0.38)" : "rgba(10,25,50,0.22)";
      ctx.lineWidth = 1.1;
      ctx.stroke();

      if (tile.fog === 1){
        drawHexPath(p.x, p.y, size);
        ctx.fillStyle = "rgba(18,32,58,0.4)";
        ctx.fill();
      }

      if (reachableSet.has(col + "," + row)){
        drawHexPath(p.x, p.y, size);
        ctx.fillStyle = "rgba(255,255,160,0.14)";
        ctx.fill();
        ctx.strokeStyle = "rgba(255,230,100,0.55)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Selected unit origin tile (strong highlight)
      const selUnit = Game.getUnit(Game.selectedUnitId);
      if (selUnit && selUnit.col === col && selUnit.row === row){
        drawHexPath(p.x, p.y, size * 1.04);
        ctx.strokeStyle = "#fff35c";
        ctx.lineWidth = 3.5;
        ctx.stroke();
        drawHexPath(p.x, p.y, size * 0.92);
        ctx.strokeStyle = "rgba(255,243,92,0.35)";
        ctx.lineWidth = 5;
        ctx.stroke();
      }
      // Selected city center
      if (Game.selectedCityId != null){
        const sc = Game.getCity(Game.selectedCityId);
        if (sc && sc.col === col && sc.row === row){
          drawHexPath(p.x, p.y, size * 1.04);
          ctx.strokeStyle = sc.civColor;
          ctx.lineWidth = 3.5;
          ctx.stroke();
        }
      }
      // Selected tile
      if (Game.selectedTile && Game.selectedTile.col === col && Game.selectedTile.row === row){
        drawHexPath(p.x, p.y, size * 1.02);
        ctx.strokeStyle = "rgba(180,210,255,0.9)";
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
    }
  }

  // cities
  for (const city of Game.cities){
    const p = HexGrid.offsetToPixel(city.col, city.row, size);
    if (Game.world.grid[city.row][city.col].fog === 0) continue;
    drawCityGlyph(p.x, p.y, size, city.civColor);
    ctx.font = "bold " + Math.max(9, size * 0.3) + "px Tahoma, 'MS Sans Serif', sans-serif";
    ctx.textAlign = "center";
    let label = city.name + "  (" + city.population + ")";
    if (city.project){
      const pname = Production.projectName(city.project);
      if (pname) label += "  [" + pname.charAt(0) + "]";
    }
    if (city.health < city.maxHealth){
      label += "  " + Math.ceil(city.health) + "HP";
    }
    const ty = p.y + size * 0.62;
    const tw = ctx.measureText(label).width + 14;
    const th = size * 0.38;
    const lx = p.x - tw / 2, ly = ty - size * 0.3;
    // Mix: beige XP face + civ accent bar
    ctx.fillStyle = "#ece9d8";
    ctx.fillRect(lx, ly, tw, th);
    ctx.strokeStyle = "#808080";
    ctx.lineWidth = 1;
    ctx.strokeRect(lx, ly, tw, th);
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.strokeRect(lx + 0.5, ly + 0.5, tw - 1, th - 1);
    ctx.fillStyle = city.civColor;
    ctx.fillRect(lx, ly, 3, th);
    ctx.fillStyle = "#000";
    ctx.fillText(label, p.x + 1, ty - size * 0.02);
  }

  // districts
  for (const dist of Game.districts){
    if (dist.col < 0 || dist.row < 0) continue;
    const tile = world.grid[dist.row][dist.col];
    if (!tile || tile.fog === 0) continue;
    const p = HexGrid.offsetToPixel(dist.col, dist.row, size);
    drawDistrictGlyph(p.x, p.y, size, dist);
  }

  // placement highlights
  if (Game.placement){
    for (const t of Game.placement.valid){
      const p = HexGrid.offsetToPixel(t.col, t.row, size);
      drawHexPath(p.x, p.y, size);
      ctx.fillStyle = "rgba(80,180,255,0.28)";
      ctx.fill();
      ctx.strokeStyle = "rgba(60,140,255,0.9)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
  if (Game.buyTileMode){
    for (const t of Game.buyTileMode.valid){
      const p = HexGrid.offsetToPixel(t.col, t.row, size);
      drawHexPath(p.x, p.y, size);
      ctx.fillStyle = "rgba(220,200,60,0.25)";
      ctx.fill();
      ctx.strokeStyle = "rgba(200,170,40,0.95)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // barbarian camps
  for (const camp of Game.barbarianCamps){
    const tile = world.grid[camp.row] && world.grid[camp.row][camp.col];
    if (!tile || tile.fog === 0) continue;
    const p = HexGrid.offsetToPixel(camp.col, camp.row, size);
    Barbarians.drawCamp(p.x, p.y, size);
  }

  // attack target highlights
  const selAtk = Game.getUnit(Game.selectedUnitId);
  if (selAtk && Combat.isMilitary(selAtk)){
    for (const t of Combat.attackTargets(selAtk)){
      const p = HexGrid.offsetToPixel(t.col, t.row, size);
      drawHexPath(p.x, p.y, size);
      ctx.fillStyle = "rgba(200,40,40,0.28)";
      ctx.fill();
      ctx.strokeStyle = "rgba(220,50,50,0.95)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  }

  // units
  for (const unit of Game.units){
    const tile = world.grid[unit.row][unit.col];
    if (tile.fog !== 2) continue;
    const p = HexGrid.offsetToPixel(unit.col, unit.row, size);
    if (unit.type === "SETTLER") drawSettlerIcon(p.x, p.y, size, unit.civColor);
    else if (unit.type === "BUILDER") drawBuilderIcon(p.x, p.y, size, unit.civColor);
    else if (unit.type === "SCOUT") drawScoutIcon(p.x, p.y, size, unit.civColor);
    else if (unit.type === "SPEARMAN") drawSpearmanIcon(p.x, p.y, size, unit.civColor);
    else if (unit.type === "SWORDSMAN") drawSwordsmanIcon(p.x, p.y, size, unit.civColor);
    else if (unit.type === "ARCHER") drawArcherIcon(p.x, p.y, size, unit.civColor);
    else drawWarriorIcon(p.x, p.y, size, unit.civColor);
    // Stance indicator ring
    if (unit.stance === "FORTIFY" || unit.stance === "HEAL"){
      ctx.beginPath();
      ctx.arc(p.x, p.y, size * 0.42, 0, Math.PI * 2);
      ctx.strokeStyle = unit.stance === "FORTIFY" ? "rgba(80,160,255,0.9)" : "rgba(80,220,120,0.9)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    if (unit.moves <= 0){
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      drawHexPath(p.x, p.y, size);
      ctx.globalAlpha = 0.18;
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    // Health bar when damaged
    if (Combat.isMilitary(unit) && unit.maxHealth > 0 && unit.health < unit.maxHealth){
      const bw = size * 0.7, bh = size * 0.1;
      const bx = p.x - bw / 2, by = p.y - size * 0.5;
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      const pct = Math.max(0, unit.health / unit.maxHealth);
      ctx.fillStyle = pct > 0.5 ? "#3fa63f" : (pct > 0.25 ? "#c9a026" : "#c43c3c");
      ctx.fillRect(bx, by, bw * pct, bh);
    }
  }

  // Path preview on top
  drawPathPreview();

  ctx.restore();
}

/* ---------------------------------------------------------------------------
   8. INPUT HANDLING (pan / zoom / click vs drag)
--------------------------------------------------------------------------- */
let isPointerDown = false, dragMoved = false, lastX = 0, lastY = 0;

canvas.addEventListener("mousedown", (e) => {
  isPointerDown = true; dragMoved = false;
  lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (isPointerDown){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
    if (dragMoved){
      Game.camera.x += dx;
      Game.camera.y += dy;
      lastX = e.clientX; lastY = e.clientY;
      render();
      hideTileTooltip();
    }
    return;
  }
  if (Game.world){
    updatePathHover(e.clientX, e.clientY);
    updateTileTooltip(e.clientX, e.clientY);
  }
});
canvas.addEventListener("mouseleave", () => {
  hideTileTooltip();
  if (hoverPath){ hoverPath = null; hoverDest = null; render(); }
});

function updatePathHover(px, py){
  if (Game.animating || !Game.selectedUnitId){
    if (hoverPath){ hoverPath = null; hoverDest = null; render(); }
    return;
  }
  const hex = pixelToHex(px, py);
  if (!hex){
    if (hoverPath){ hoverPath = null; hoverDest = null; render(); }
    return;
  }
  const dest = reachableCache.find(t => t.col === hex.col && t.row === hex.row);
  if (!dest){
    if (hoverPath){ hoverPath = null; hoverDest = null; render(); }
    return;
  }
  const key = hex.col + "," + hex.row;
  const path = pathCache[key] || [];
  // Only re-render if destination changed
  if (!hoverDest || hoverDest.col !== hex.col || hoverDest.row !== hex.row){
    hoverPath = path;
    hoverDest = dest;
    render();
  }
}
