canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const oldZoom = Game.camera.zoom;
  let newZoom = oldZoom * (e.deltaY < 0 ? 1.1 : 0.9);
  newZoom = Math.max(CONFIG.MIN_ZOOM, Math.min(CONFIG.MAX_ZOOM, newZoom));
  const mx = e.clientX, my = e.clientY;
  const worldX = (mx - Game.camera.x) / oldZoom;
  const worldY = (my - Game.camera.y) / oldZoom;
  Game.camera.x = mx - worldX * newZoom;
  Game.camera.y = my - worldY * newZoom;
  Game.camera.zoom = newZoom;
  render();
}, { passive: false });

document.getElementById("zoom-in").addEventListener("click", () => zoomStep(1.2));
document.getElementById("zoom-out").addEventListener("click", () => zoomStep(0.8));
function zoomStep(factor){
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const oldZoom = Game.camera.zoom;
  let newZoom = Math.max(CONFIG.MIN_ZOOM, Math.min(CONFIG.MAX_ZOOM, oldZoom * factor));
  const worldX = (cx - Game.camera.x) / oldZoom;
  const worldY = (cy - Game.camera.y) / oldZoom;
  Game.camera.x = cx - worldX * newZoom;
  Game.camera.y = cy - worldY * newZoom;
  Game.camera.zoom = newZoom;
  render();
}

function pixelToHex(px, py){
  const size = CONFIG.HEX_SIZE;
  const worldX = (px - Game.camera.x) / Game.camera.zoom;
  const worldY = (py - Game.camera.y) / Game.camera.zoom;
  let bestCol = 0, bestRow = 0, bestDist = Infinity;
  const approxRow = Math.round(worldY / (size * 1.5));
  for (let row = Math.max(0, approxRow - 2); row <= Math.min(Game.world.h - 1, approxRow + 2); row++){
    const approxCol = Math.round(worldX / (size * Math.sqrt(3)) - 0.5 * (row & 1));
    for (let col = Math.max(0, approxCol - 2); col <= Math.min(Game.world.w - 1, approxCol + 2); col++){
      const p = HexGrid.offsetToPixel(col, row, size);
      const d = Math.hypot(p.x - worldX, p.y - worldY);
      if (d < bestDist){ bestDist = d; bestCol = col; bestRow = row; }
    }
  }
  if (bestDist > size * 1.05) return null;
  return { col: bestCol, row: bestRow };
}

function handleMapClick(px, py){
  if (Game.animating || Game.aiThinking) return;
  const hex = pixelToHex(px, py);
  if (!hex){
    if (Game.placement){ Districts.cancelPlacement(); return; }
    Selection.clear();
    return;
  }
  const { col, row } = hex;
  const tile = Game.world.grid[row][col];

  // District placement mode
  if (Game.placement){
    if (tile.fog === 0) return;
    if (Districts.confirmPlacement(col, row)) return;
    Notify.push("Invalid district placement.");
    return;
  }

  // Buy tile mode
  if (Game.buyTileMode){
    if (tile.fog === 0) return;
    const city = Game.getCity(Game.buyTileMode.cityId);
    const hit = Game.buyTileMode.valid.find(t => t.col === col && t.row === row);
    if (city && hit){
      if (CityTerritory.buyTile(city, col, row)){
        Game.buyTileMode = null;
        updateHud();
        refreshCityWindow(city);
        render();
      }
      return;
    }
    Notify.push("That tile cannot be purchased.");
    return;
  }

  if (tile.fog === 0) return;

  const clickedUnit = Game.unitAt(col, row);
  const clickedCity = Game.cityAt(col, row);
  const pid = Game.playerCivId;

  const selected = Game.getUnit(Game.selectedUnitId);

  // Priority 1: unit
  if (clickedUnit){
    // Attack enemy / barb if selected military can attack
    if (selected && selected.civId === pid && Combat.canUnitAttack(selected, clickedUnit)){
      Game.animating = true;
      Combat.attackUnit(selected, clickedUnit);
      setTimeout(() => {
        Game.animating = false;
        Selection.refreshReachable();
        updateUnitPanel();
        updateHud();
        FogOfWar.recompute();
        render();
      }, 120);
      return;
    }
    if (clickedUnit.civId !== pid){
      openForeignDiplomacy(clickedUnit.civId, clickedUnit);
      return;
    }
    if (Game.selectedUnitId === clickedUnit.id) Selection.clear();
    else Selection.selectUnit(clickedUnit.id);
    return;
  }

  // Priority 2: city
  if (clickedCity){
    if (selected && selected.civId === pid && Combat.canAttackCity(selected, clickedCity)){
      Game.animating = true;
      Combat.attackCity(selected, clickedCity);
      setTimeout(() => {
        Game.animating = false;
        Selection.refreshReachable();
        updateUnitPanel();
        updateHud();
        FogOfWar.recompute();
        render();
      }, 120);
      return;
    }
    if (clickedCity.civId !== pid){
      openForeignDiplomacy(clickedCity.civId, null, clickedCity);
      return;
    }
    if (Game.selectedCityId === clickedCity.id) Selection.clear();
    else {
      Selection.selectCity(clickedCity.id);
      openCityWindow(clickedCity);
    }
    return;
  }

  // Barbarian camp attack / destroy
  const camp = Barbarians.campAt(col, row);
  if (camp && selected && selected.civId === pid){
    if (Combat.canUnitAttack(selected, Game.unitAt(col, row) || { civId: CONFIG.BARBARIAN_CIV_ID, col, row, type:"BARBARIAN_WARRIOR", combatStrength:1, health:1, maxHealth:1 })){
      /* handled via unit */
    }
    if (HexGrid.distance(selected.col, selected.row, col, row) === 1 && Combat.isMilitary(selected) && !selected.hasAttacked && selected.moves > 0){
      Combat.attackCamp(selected, camp);
      Selection.refreshReachable();
      updateUnitPanel();
      updateHud();
      render();
      return;
    }
  }

  // Priority 3: movement
  if (selected && selected.civId === pid){
    const dest = reachableCache.find(t => t.col === col && t.row === row);
    if (dest){
      const key = col + "," + row;
      const path = (pathCache[key] || [{ col, row }]);
      moveUnitAlongPath(selected, path, dest.cost);
      return;
    }
    Selection.clear();
    return;
  }

  // Priority 4: tile
  if (Game.selectedTile && Game.selectedTile.col === col && Game.selectedTile.row === row) Selection.clear();
  else Selection.selectTile(col, row);
}

let reachableCache = [];
let pathCache = {};
let hoverPath = null;   // [{col,row}, ...]
let hoverDest = null;   // {col,row,cost}

const Selection = {
  selectUnit(id){
    Game.selectedUnitId = id;
    Game.selectedCityId = null;
    Game.selectedTile = null;
    hoverPath = null;
    hoverDest = null;
    const unit = Game.getUnit(id);
    if (unit && unit.moves > 0){
      const result = Movement.compute(unit);
      reachableCache = result.reachable;
      pathCache = result.paths;
    } else {
      reachableCache = [];
      pathCache = {};
    }
    updateUnitPanel();
    render();
  },
  selectCity(id){
    Game.selectedCityId = id;
    Game.selectedUnitId = null;
    Game.selectedTile = null;
    reachableCache = [];
    pathCache = {};
    hoverPath = null;
    hoverDest = null;
    updateUnitPanel();
    render();
  },
  selectTile(col, row){
    Game.selectedTile = { col, row };
    Game.selectedUnitId = null;
    Game.selectedCityId = null;
    reachableCache = [];
    pathCache = {};
    hoverPath = null;
    hoverDest = null;
    updateUnitPanel();
    render();
  },
  clear(){
    Game.selectedUnitId = null;
    Game.selectedCityId = null;
    Game.selectedTile = null;
    reachableCache = [];
    pathCache = {};
    hoverPath = null;
    hoverDest = null;
    updateUnitPanel();
    render();
  },
  refreshReachable(){
    const unit = Game.getUnit(Game.selectedUnitId);
    if (unit && unit.moves > 0){
      const result = Movement.compute(unit);
      reachableCache = result.reachable;
      pathCache = result.paths;
    } else {
      reachableCache = [];
      pathCache = {};
    }
    hoverPath = null;
    hoverDest = null;
  }
};

function unitTypeName(type){
  if (UNIT_DEFS[type]) return UNIT_DEFS[type].name;
  if (type === "SETTLER") return "Settler";
  if (type === "WARRIOR") return "Warrior";
  if (type === "BUILDER") return "Builder";
  return type;
}

function updateUnitPanel(){
  const panel = document.getElementById("unit-panel");
  const unit = Game.getUnit(Game.selectedUnitId);
  if (!unit){ panel.style.display = "none"; return; }
  panel.style.display = "block";
  document.getElementById("unit-panel-title").textContent = unitTypeName(unit.type);

  const tile = Game.world.grid[unit.row][unit.col];
  const terrainName = TERRAIN[tile.terrain].name;
  const canFound = unit.type === "SETTLER" && !Game.cityAt(unit.col, unit.row) &&
    TERRAIN[tile.terrain].passable;
  const isMil = Combat.isMilitary(unit);
  const stanceLabel = unit.stance === "FORTIFY" ? "Fortified" :
    (unit.stance === "HEAL" ? "Resting" : "Active");

  let html = "";
  html += `<div class="xp-row"><span class="label">Location</span><span class="value">${terrainName}</span></div>`;
  html += `<div class="xp-row"><span class="label">Movement</span><span class="value">${unit.moves} / ${unit.movesMax}</span></div>`;
  if (isMil){
    const defBonus = unit.stance === "FORTIFY" ? " (+35% def)" : "";
    html += `<div class="xp-row"><span class="label">Strength</span><span class="value">${unit.combatStrength || 0}${defBonus}</span></div>`;
    html += `<div class="xp-row"><span class="label">Health</span><span class="value">${Math.ceil(unit.health || 0)} / ${unit.maxHealth || 0}</span></div>`;
    html += `<div class="xp-row"><span class="label">Attack</span><span class="value">${unit.hasAttacked ? "Used" : "Ready"}</span></div>`;
    html += `<div class="xp-row"><span class="label">Stance</span><span class="value">${stanceLabel}</span></div>`;
  }
  if (unit.type === "BUILDER"){
    html += `<div class="xp-row"><span class="label">Build Charges</span><span class="value">${unit.charges != null ? unit.charges : 0}</span></div>`;
  }
  html += `<div class="xp-divider"></div>`;
  html += `<div class="actions">`;
  if (canFound){
    html += `<button class="xp-btn primary" id="btn-found-city">Found City</button>`;
  }
  if (unit.type === "BUILDER"){
    const actions = Improvements.validActions(unit);
    for (const aid of actions){
      const def = IMPROVEMENTS[aid];
      const label = aid === "REMOVE_FOREST" ? "Remove Forest" : ("Build " + (def ? def.name : aid));
      html += `<button class="xp-btn primary" data-build="${aid}">${label}</button>`;
    }
    if (actions.length === 0){
      const owned = Improvements.ownsTile(unit, unit.col, unit.row);
      html += `<div class="hint-text" style="width:100%;text-align:left">${owned ? "No valid improvements on this tile." : "Tile not owned by your civilization."}</div>`;
    }
  }
  if (isMil){
    if (unit.stance === "FORTIFY" || unit.stance === "HEAL"){
      html += `<button class="xp-btn primary" id="btn-wake-unit">Wake Up</button>`;
    } else {
      html += `<button class="xp-btn" id="btn-fortify-unit" title="Stay put and gain +35% combat strength. Does not need orders each turn.">Fortify</button>`;
      if (unit.maxHealth > 0 && unit.health < unit.maxHealth){
        html += `<button class="xp-btn" id="btn-heal-unit" title="Rest to recover health each turn. Does not need orders.">Rest &amp; Heal</button>`;
      }
    }
  }
  html += `<button class="xp-btn" id="btn-skip-unit">Skip Turn</button>`;
  html += `</div>`;
  document.getElementById("unit-panel-body").innerHTML = html;

  if (canFound){
    document.getElementById("btn-found-city").addEventListener("click", () => {
      promptFoundCity(unit);
    });
  }
  const skipBtn = document.getElementById("btn-skip-unit");
  if (skipBtn) skipBtn.addEventListener("click", () => {
    UnitOrders.clearStance(unit);
    unit.moves = 0;
    unit.turnComplete = true;
    unit.hasAttacked = true;
    Selection.refreshReachable();
    updateUnitPanel();
    updateHud();
    render();
  });
  const fortBtn = document.getElementById("btn-fortify-unit");
  if (fortBtn) fortBtn.addEventListener("click", () => {
    UnitOrders.setStance(unit, "FORTIFY");
    Notify.push(unitTypeName(unit.type) + " is fortifying.");
    Selection.refreshReachable();
    updateUnitPanel();
    updateHud();
    render();
  });
  const healBtn = document.getElementById("btn-heal-unit");
  if (healBtn) healBtn.addEventListener("click", () => {
    UnitOrders.setStance(unit, "HEAL");
    Notify.push(unitTypeName(unit.type) + " is resting to recover.");
    Selection.refreshReachable();
    updateUnitPanel();
    updateHud();
    render();
  });
  const wakeBtn = document.getElementById("btn-wake-unit");
  if (wakeBtn) wakeBtn.addEventListener("click", () => {
    UnitOrders.clearStance(unit);
    unit.moves = unit.movesMax;
    unit.turnComplete = false;
    unit.hasAttacked = false;
    Notify.push(unitTypeName(unit.type) + " is active again.");
    Selection.refreshReachable();
    updateUnitPanel();
    updateHud();
    render();
  });
  panel.querySelectorAll("[data-build]").forEach(btn => {
    btn.addEventListener("click", () => {
      const aid = btn.getAttribute("data-build");
      if (Improvements.build(unit, aid)){
        Selection.refreshReachable();
        updateUnitPanel();
        updateHud();
        refreshAllCityWindows();
        render();
      }
    });
  });
}

/* Animated movement along path */
function moveUnitAlongPath(unit, path, totalCost){
  if (!path || !path.length) return;
  UnitOrders.clearStance(unit);
  Game.animating = true;
  hoverPath = null;
  hoverDest = null;
  let i = 0;
  const step = () => {
    if (i >= path.length){
      unit.moves -= totalCost;
      if (unit.moves < 0) unit.moves = 0;
      if (unit.moves <= 0) unit.turnComplete = true;
      FogOfWar.recompute();
      Selection.refreshReachable();
      updateUnitPanel();
      updateHud();
      Game.animating = false;
      render();
      return;
    }
    const p = path[i];
    unit.col = p.col;
    unit.row = p.row;
    i++;
    render();
    setTimeout(step, 70);
  };
  step();
}

function makeWindowDraggable(win){
  const handle = win.querySelector("[data-drag-handle]");
  if (!handle) return;
  let dragging = false, offX = 0, offY = 0;
  const bringToFront = () => { win.style.zIndex = ++windowZCounter; };
  // Any click on the window (titlebar or body) raises it, like classic Windows
  win.addEventListener("mousedown", bringToFront);
  handle.addEventListener("mousedown", (e) => {
    dragging = true;
    bringToFront();
    offX = e.clientX - win.offsetLeft;
    offY = e.clientY - win.offsetTop;
    e.stopPropagation();
    e.preventDefault();
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    win.style.left = Math.max(0, e.clientX - offX) + "px";
    win.style.top = Math.max(0, e.clientY - offY) + "px";
  });
  window.addEventListener("mouseup", () => { dragging = false; });
}

/* ---------------------------------------------------------------------------
   11. TURN SYSTEM + AI
--------------------------------------------------------------------------- */
const AI = {
  difficulty(civ){
    return AI_DIFFICULTY[civ.difficulty] || AI_DIFFICULTY.NORMAL;
  },

  processCiv(civ){
    // Refresh unit moves already done globally
    for (const city of Game.citiesOf(civ.id)){
      this.processCity(civ, city);
    }
    // Units: settlers, builders, warriors
    const units = Game.unitsOf(civ.id).slice();
    for (const u of units){
      if (u.moves <= 0) continue;
      if (u.type === "SETTLER") this.runSettler(civ, u);
      else if (u.type === "BUILDER") this.runBuilder(civ, u);
      else this.runMilitary(civ, u);
    }
  },

  processCity(civ, city){
    Citizens.autoAssign(city);
    const diff = this.difficulty(civ);
    const totals = Yields.cityTotals(city);
    const prod = totals.production + (diff.prodBonus || 0);

    city.food += totals.food;
    const needed = Math.max(8, Math.round(city.foodNeeded * totals.foodNeededMult));
    if (city.food >= needed){
      city.food -= needed;
      city.population += 1;
      city.foodNeeded = 12 + city.population * 5;
      Citizens.autoAssign(city);
    }

    if (city.project){
      Production.advance(city, prod);
    } else {
      this.chooseProduction(civ, city);
    }

    city.culture = (city.culture || 0) + 1 + (totals.culture || 0);
    // AI purchases tiles deliberately (see AI.considerBuyTiles)
    this.considerBuyTiles(civ, city);

    civ.gold += totals.gold;
  },

  chooseProduction(civ, city){
    const diff = this.difficulty(civ);
    const units = Game.unitsOf(civ.id);
    const builders = units.filter(u => u.type === "BUILDER").length;
    const settlers = units.filter(u => u.type === "SETTLER").length;
    const military = units.filter(u => Combat.isMilitary(u)).length;
    const scouts = units.filter(u => u.type === "SCOUT").length;
    const nCities = Game.citiesOf(civ.id).length;

    // Priority stack
    if (builders < Math.max(1, Math.floor(nCities * diff.builderBias)) && Math.random() < 0.7){
      Production.startProject(city, "UNIT", "BUILDER");
      return;
    }
    if (nCities < 2 + Math.floor(diff.expandBias * 2) && settlers < 1 && city.population >= 2 && Math.random() < diff.expandBias){
      Production.startProject(city, "UNIT", "SETTLER");
      return;
    }
    if (scouts < 1 && nCities <= 2 && Math.random() < 0.35){
      Production.startProject(city, "UNIT", "SCOUT");
      return;
    }
    if (military < nCities + 1 && Math.random() < 0.45){
      const candidates = ["WARRIOR", "ARCHER", "SPEARMAN", "SWORDSMAN"].filter(u => TechSystem.unitUnlocked(civ, u));
      const pick = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : "WARRIOR";
      Production.startProject(city, "UNIT", pick);
      return;
    }
    // City center buildings
    if (!city.buildings.includes("MONUMENT")){
      Production.startProject(city, "BUILDING", "MONUMENT");
      return;
    }
    if (!city.buildings.includes("GRANARY") && TechSystem.buildingUnlocked(civ, "GRANARY") && Math.random() < 0.6){
      Production.startProject(city, "BUILDING", "GRANARY");
      return;
    }
    // Districts
    if (Districts.canBuildMore(city) && Math.random() < diff.districtBias){
      const avail = Production.availableDistricts(city);
      if (avail.length){
        const pick = avail[Math.floor(Math.random() * avail.length)];
        const tiles = Districts.validPlacementTiles(city, pick.id);
        if (tiles.length){
          tiles.sort((a, b) => {
            const ya = Yields.tileYields(a.col, a.row);
            const yb = Yields.tileYields(b.col, b.row);
            return (yb.production + yb.gold) - (ya.production + ya.gold);
          });
          const t = tiles[0];
          const district = {
            id: Game.nextDistrictId++,
            type: pick.id,
            cityId: city.id,
            civId: city.civId,
            col: t.col, row: t.row,
            state: "UNDER_CONSTRUCTION",
            buildings: [],
            progress: 0
          };
          Game.districts.push(district);
          Game.world.grid[t.row][t.col].districtId = district.id;
          city.project = { type: "DISTRICT", id: pick.id, districtId: district.id, progress: 0 };
          return;
        }
      }
    }
    // District buildings
    const bAvail = Production.availableBuildings(city).filter(b => b.location !== "CITY_CENTER");
    if (bAvail.length){
      Production.startProject(city, "BUILDING", bAvail[0].id);
      return;
    }
    const fallback = TechSystem.unitUnlocked(civ, "SPEARMAN") && Math.random() < 0.4 ? "SPEARMAN" : "WARRIOR";
    Production.startProject(city, "UNIT", fallback);
  },

  considerBuyTiles(civ, city){
    if (civ.gold < 25) return;
    const tiles = CityTerritory.purchasableTiles(city);
    if (!tiles.length) return;
    // Prefer resource tiles then high yield
    tiles.sort((a, b) => {
      const ta = Game.world.grid[a.row][a.col];
      const tb = Game.world.grid[b.row][b.col];
      const sa = (ta.resource ? 20 : 0) + Yields.tileYields(a.col, a.row).food * 3 + Yields.tileYields(a.col, a.row).production * 2 - a.cost * 0.05;
      const sb = (tb.resource ? 20 : 0) + Yields.tileYields(b.col, b.row).food * 3 + Yields.tileYields(b.col, b.row).production * 2 - b.cost * 0.05;
      return sb - sa;
    });
    const pick = tiles[0];
    if (pick && civ.gold >= pick.cost && (Game.world.grid[pick.row][pick.col].resource || Math.random() < 0.25)){
      CityTerritory.buyTile(city, pick.col, pick.row);
    }
  },

  runSettler(civ, unit){
    const score = MapGen.scoreStartTile(Game.world, unit.col, unit.row);
    const cities = Game.citiesOf(civ.id);
    let farEnough = true;
    for (const c of cities){
      if (HexGrid.distance(unit.col, unit.row, c.col, c.row) < 4) farEnough = false;
    }
    if (score > 5 && farEnough && TERRAIN[Game.world.grid[unit.row][unit.col].terrain].passable){
      Game.founderFoundCity(unit, civ.name.split(" ").pop() + " " + (cities.length + 1));
      return;
    }
    // Move toward high-score unexplored land
    this.wander(unit, (col, row) => MapGen.scoreStartTile(Game.world, col, row));
  },

  runBuilder(civ, unit){
    const actions = Improvements.validActions(unit);
    if (actions.length){
      // Prefer resource improvements
      const tile = Game.world.grid[unit.row][unit.col];
      let pick = actions[0];
      if (tile.resource){
        const res = RESOURCES[tile.resource];
        if (res && actions.includes(res.improvement)) pick = res.improvement;
      }
      Improvements.build(unit, pick);
      return;
    }
    // Seek owned resource tile without improvement
    const cities = Game.citiesOf(civ.id);
    let best = null, bestScore = -1;
    for (const city of cities){
      for (const t of CityTerritory.ownedTiles(city)){
        const tile = Game.world.grid[t.row][t.col];
        if (tile.improvement || tile.cityId || tile.districtId) continue;
        if (!TERRAIN[tile.terrain].passable) continue;
        let s = 1;
        if (tile.resource) s += 5;
        s -= HexGrid.distance(unit.col, unit.row, t.col, t.row);
        if (s > bestScore){ bestScore = s; best = t; }
      }
    }
    if (best) this.moveToward(unit, best.col, best.row);
    else this.wander(unit, null);
  },

  runMilitary(civ, unit){
    if (!Combat.isMilitary(unit)) { this.wander(unit, null); return; }
    // Already holding a stance — stay put
    if (unit.stance === "FORTIFY" || unit.stance === "HEAL") return;
    // Heal if badly damaged
    if (unit.maxHealth > 0 && unit.health < unit.maxHealth * 0.45 && Math.random() < 0.7){
      UnitOrders.setStance(unit, "HEAL");
      return;
    }
    // Attack adjacent enemies if at war
    const targets = Combat.attackTargets(unit);
    if (targets.length){
      const t = targets[0];
      if (t.type === "UNIT") Combat.attackUnit(unit, t.unit);
      else if (t.type === "CITY") Combat.attackCity(unit, t.city);
      else if (t.type === "CAMP") Combat.attackCamp(unit, t.camp);
      return;
    }
    // Seek nearby hostiles within 6 tiles
    let best = null, bestD = 99;
    for (const o of Game.units){
      if (o.civId === unit.civId) continue;
      if (!Diplomacy.canAttack(unit.civId, o.civId)) continue;
      const d = HexGrid.distance(unit.col, unit.row, o.col, o.row);
      if (d < bestD && d <= 8){ bestD = d; best = o; }
    }
    // Defend own cities if threatened
    for (const city of Game.citiesOf(civ.id)){
      for (const o of Game.units){
        if (o.civId === civ.id) continue;
        if (!Diplomacy.canAttack(civ.id, o.civId)) continue;
        if (HexGrid.distance(city.col, city.row, o.col, o.row) <= 3){
          this.moveToward(unit, city.col, city.row);
          return;
        }
      }
    }
    if (best){ this.moveToward(unit, best.col, best.row); return; }
    // Occasional war declaration if strong
    if (Math.random() < 0.02 * (this.difficulty(civ).expandBias || 0.5)){
      for (const other of Game.civilizations){
        if (other.id === civ.id || other.isPlayer === false && Math.random() < 0.5) continue;
        if (Diplomacy.get(civ.id, other.id) === "PEACE"){
          const myUnits = Game.unitsOf(civ.id).filter(u => Combat.isMilitary(u)).length;
          const theirUnits = Game.unitsOf(other.id).filter(u => Combat.isMilitary(u)).length;
          if (myUnits >= theirUnits + 1){
            Diplomacy.declareWar(civ.id, other.id);
            break;
          }
        }
      }
    }
    // Idle near a friendly city: fortify instead of wandering forever
    for (const city of Game.citiesOf(civ.id)){
      if (HexGrid.distance(unit.col, unit.row, city.col, city.row) <= 2 && Math.random() < 0.4){
        UnitOrders.setStance(unit, "FORTIFY");
        return;
      }
    }
    this.wander(unit, null);
  },

  moveToward(unit, tcol, trow){
    const result = Movement.compute(unit);
    if (!result.reachable.length) return;
    let best = null, bestD = Infinity;
    for (const r of result.reachable){
      const d = HexGrid.distance(r.col, r.row, tcol, trow);
      if (d < bestD){ bestD = d; best = r; }
    }
    if (best){
      unit.col = best.col;
      unit.row = best.row;
      unit.moves -= best.cost;
      if (unit.moves < 0) unit.moves = 0;
    }
  },

  wander(unit, scoreFn){
    const result = Movement.compute(unit);
    if (!result.reachable.length){ unit.moves = 0; return; }
    let pick = result.reachable[0];
    if (scoreFn){
      let best = -Infinity;
      for (const r of result.reachable){
        const s = scoreFn(r.col, r.row);
        if (s > best){ best = s; pick = r; }
      }
    } else {
      pick = result.reachable[Math.floor(Math.random() * result.reachable.length)];
    }
    unit.col = pick.col;
    unit.row = pick.row;
    unit.moves -= pick.cost;
    if (unit.moves < 0) unit.moves = 0;
  }
};

function processPlayerCities(){
  let goldThisTurn = 0;
  const pid = Game.playerCivId;
  for (const city of Game.citiesOf(pid)){
    Citizens.autoAssign(city);
    const totals = Yields.cityTotals(city);
    city.food += totals.food;
    const needed = Math.max(8, Math.round(city.foodNeeded * totals.foodNeededMult));
    if (city.food >= needed){
      city.food -= needed;
      city.population += 1;
      city.foodNeeded = 12 + city.population * 5;
      Citizens.autoAssign(city);
      Notify.push(city.name + " has grown to Population " + city.population + ".");
    }
    if (city.project){
      city.project = Production.normalize(city.project) || city.project;
      Production.advance(city, totals.production);
    }
    city.culture = (city.culture || 0) + 1 + (totals.culture || 0);
    // Territory no longer expands automatically — tiles are purchased with Gold
    goldThisTurn += totals.gold;
  }
  const pc = Game.playerCiv();
  if (pc){
    pc.gold += goldThisTurn;
    pc.gpt = goldThisTurn;
    TechSystem.processTurn(pc);
    Game.civ = pc;
  }
}

function checkDiscoveries(){
  const pid = Game.playerCivId;
  for (const u of Game.unitsOf(pid)){
    for (const other of Game.units){
      if (other.civId === pid) continue;
      if (HexGrid.distance(u.col, u.row, other.col, other.row) > CONFIG.VISION_RADIUS) continue;
      if (!Game.discoveredCivs[other.civId]){
        Game.discoveredCivs[other.civId] = true;
        Diplomacy.meet(Game.playerCivId, other.civId);
        const civ = Game.getCiv(other.civId);
        Notify.push("Your civilization has encountered " + (civ ? civ.name : "another people") + ".");
      }
    }
    for (const city of Game.cities){
      if (city.civId === pid) continue;
      if (HexGrid.distance(u.col, u.row, city.col, city.row) > CONFIG.VISION_RADIUS) continue;
      if (!Game.discoveredCivs[city.civId]){
        Game.discoveredCivs[city.civId] = true;
        Diplomacy.meet(Game.playerCivId, city.civId);
        const civ = Game.getCiv(city.civId);
        Notify.push("Your civilization has encountered " + (civ ? civ.name : "another people") + ".");
      }
    }
  }
}

const UnitOrders = {
  needsOrders(unit){
    if (!unit) return false;
    if (unit.civId !== Game.playerCivId) return false;
    if (unit.stance === "FORTIFY" || unit.stance === "HEAL") return false;
    if (unit.turnComplete) return false;
    if (unit.moves <= 0) return false;
    return true;
  },
  playerUnitsNeedingOrders(){
    return Game.units.filter(u => this.needsOrders(u));
  },
  citiesNeedingProduction(){
    return Game.citiesOf(Game.playerCivId).filter(c => !c.project);
  },
  setStance(unit, stance){
    if (!unit) return;
    unit.stance = stance; // null | "FORTIFY" | "HEAL"
    if (stance){
      unit.moves = 0;
      unit.turnComplete = true;
      unit.hasAttacked = true;
    }
  },
  clearStance(unit){
    if (!unit) return;
    unit.stance = null;
  },
  /* Called at the start of each turn for every unit that kept a stance */
  processStance(unit){
    if (!unit || !unit.stance) return;
    if (unit.stance === "HEAL" && unit.maxHealth > 0){
      const before = unit.health;
      // Heal ~25 HP / turn (more when on friendly territory)
      let amount = 25;
      if (CityTerritory.civOwnsTile(unit.civId, unit.col, unit.row)) amount = 35;
      unit.health = Math.min(unit.maxHealth, (unit.health || 0) + amount);
      if (unit.civId === Game.playerCivId && unit.health > before){
        if (unit.health >= unit.maxHealth){
          Notify.push(unitTypeName(unit.type) + " fully recovered.");
          unit.stance = null; // auto-clear when fully healed
        }
      }
    }
    // Fortify and Heal both stay in place: zero moves so they don't need orders
    unit.moves = 0;
    unit.turnComplete = true;
    unit.hasAttacked = true;
  }
};

function tryEndTurn(){
  if (Game.aiThinking || Game.animating) return;
  const units = UnitOrders.playerUnitsNeedingOrders();
  const cities = UnitOrders.citiesNeedingProduction();
  if (units.length === 0 && cities.length === 0){
    nextTurn();
    return;
  }
  let lines = "";
  if (units.length) lines += `<div class="xp-row"><span class="label">${units.length} unit(s) need orders</span></div>`;
  for (const c of cities.slice(0, 5)){
    lines += `<div class="xp-row"><span class="label">${c.name} needs production</span></div>`;
  }
  if (cities.length > 5) lines += `<div class="hint-text">...and ${cities.length - 5} more cities</div>`;
  showModal("End Turn — Attention Required", `
    <p style="margin:0 0 6px">The following still need attention:</p>
    ${lines}
    <div class="modal-actions">
      <button class="xp-btn" id="btn-alert-cancel">Cancel</button>
      <button class="xp-btn" id="btn-alert-next">Select Next</button>
      <button class="xp-btn primary" id="btn-alert-anyway">End Turn Anyway</button>
    </div>
  `);
  document.getElementById("btn-alert-cancel").addEventListener("click", hideModal);
  document.getElementById("btn-alert-anyway").addEventListener("click", () => { hideModal(); nextTurn(); });
  document.getElementById("btn-alert-next").addEventListener("click", () => {
    hideModal();
    const u = UnitOrders.playerUnitsNeedingOrders()[0];
    if (u){
      Selection.selectUnit(u.id);
      centerCameraOnStart(u.col, u.row);
      return;
    }
    const c = UnitOrders.citiesNeedingProduction()[0];
    if (c){
      Selection.selectCity(c.id);
      openCityWindow(c);
      centerCameraOnStart(c.col, c.row);
    }
  });
}

function nextTurn(){
  if (Game.aiThinking || Game.animating) return;
  Game.turn++;
  for (const unit of Game.units){
    if (unit.stance === "FORTIFY" || unit.stance === "HEAL"){
      UnitOrders.processStance(unit);
    } else {
      unit.moves = unit.movesMax;
      unit.hasAttacked = false;
      unit.turnComplete = false;
      unit.stance = null;
    }
  }

  processPlayerCities();
  checkDiscoveries();
  try { Barbarians.processTurn(); } catch (e) { console.error(e); }

  // AI turns
  Game.aiThinking = true;
  const aiCivs = Game.civilizations.filter(c => !c.isPlayer);
  let i = 0;
  function runNextAI(){
    if (i >= aiCivs.length){
      Game.aiThinking = false;
      FogOfWar.recompute();
      checkDiscoveries();
      hoverPath = null;
      hoverDest = null;
      if (typeof Selection !== "undefined") Selection.refreshReachable();
      updateHud();
      updateUnitPanel();
      refreshAllCityWindows();
      refreshEmpireWindow();
      render();
      return;
    }
    const civ = aiCivs[i++];
    try {
      TechSystem.processTurn(civ);
      AI.processCiv(civ);
    } catch (err){ console.error("AI error", err); }
    // Yield to browser between AI civs
    setTimeout(runNextAI, 0);
  }
  if (aiCivs.length){
    Notify.push("Other civilizations are taking their turns...");
    setTimeout(runNextAI, 10);
  } else {
    Game.aiThinking = false;
    FogOfWar.recompute();
    hoverPath = null;
    hoverDest = null;
    if (typeof Selection !== "undefined") Selection.refreshReachable();
    updateHud();
    updateUnitPanel();
    refreshAllCityWindows();
    refreshEmpireWindow();
    render();
  }
}
document.getElementById("next-turn-btn").addEventListener("click", tryEndTurn);

function updateHud(){
  const _pc = Game.playerCiv() || Game.civ; document.getElementById("hud-civ-name").textContent = _pc ? _pc.name : "";
  document.getElementById("hud-civ-swatch").style.background = _pc ? _pc.color : "#1c62d6";

  document.getElementById("hud-year").textContent = Game.yearLabel();
  document.getElementById("hud-cities").textContent = Game.citiesOf(Game.playerCivId).length;
  const pc = Game.playerCiv() || Game.civ || { gold:0, gpt:0, name:"", color:"#1c62d6" };
  Game.civ = pc;
  document.getElementById("hud-gold").textContent = pc.gold || 0;
  const gptEl = document.getElementById("hud-gpt");
  if (gptEl){
    const gpt = pc.gpt || 0;
    gptEl.textContent = (gpt >= 0 ? "+" : "") + gpt;
  }
  document.getElementById("hud-cities").textContent = Game.citiesOf(Game.playerCivId).length;
  const sciEl = document.getElementById("hud-science");
  if (sciEl){
    const spt = TechSystem.scienceOutput(pc);
    pc.sciencePerTurn = spt;
    sciEl.textContent = spt;
  }
  const resEl = document.getElementById("hud-research");
  if (resEl){
    if (pc.researching && TECHS[pc.researching]){
      const t = TECHS[pc.researching];
      const turns = TechSystem.turnsRemaining(pc);

    } else {
      resEl.textContent = "Research: None";
    }
  }
  const waiting = UnitOrders.playerUnitsNeedingOrders().length;
  document.getElementById("units-waiting").textContent = waiting;
}

/* Technology window — Civ-style node tree inside XP chrome */
function openTechWindow(){
  let win = document.getElementById("tech-win");
  if (win){ win.style.zIndex = ++windowZCounter; refreshTechWindow(); return; }
  win = document.createElement("div");
  win.className = "xp-window";
  win.id = "tech-win";
  win.style.width = "720px";
  win.style.left = "40px";
  win.style.top = "48px";
  win.style.zIndex = ++windowZCounter;
  win.innerHTML = `
    <div class="xp-titlebar" data-drag-handle>
      <div class="xp-icon"></div>
      <div class="xp-title-text">Technology Tree</div>
      <div class="xp-winbtns"><div class="xp-winbtn close" data-close></div></div>
    </div>
    <div class="xp-winbody" style="padding:8px">
      <div class="tech-status-bar" data-tech-status></div>

function refreshTechWindow(){
  const win = document.getElementById("tech-win");
  if (!win) return;
  const civ = Game.playerCiv() || Game.civ;
  if (!civ) return;
  if (!civ.techs) civ.techs = {};

  const sci = TechSystem.scienceOutput(civ);
  civ.sciencePerTurn = sci;
  const status = win.querySelector("[data-tech-status]");
  if (civ.researching && TECHS[civ.researching]){
    const t = TECHS[civ.researching];
    const turns = TechSystem.turnsRemaining(civ);
    const pct = Math.min(100, ((civ.scienceProgress || 0) / t.cost) * 100);
    status.innerHTML = `
      <strong>Researching:</strong> ${t.name}
      &nbsp;·&nbsp; ${civ.scienceProgress || 0} / ${t.cost} science
      &nbsp;·&nbsp; +${sci}/turn
      &nbsp;·&nbsp; ~${turns != null ? turns : "—"} turns
      <div class="xp-progress" style="margin-top:4px"><div style="width:${pct}%"></div></div>
    `;
  } else {
    status.innerHTML = `<strong>Researching:</strong> None selected &nbsp;·&nbsp; Science +${sci}/turn &nbsp;— click a yellow technology to begin.`;
  }

  function unlockLine(t){
    const u = t.unlocks || {};
    const parts = [];
    (u.units || []).forEach(id => parts.push(UNIT_DEFS[id] ? UNIT_DEFS[id].name : id));
    (u.buildings || []).forEach(id => parts.push(BUILDINGS[id] ? BUILDINGS[id].name : id));
    (u.improvements || []).forEach(id => parts.push(IMPROVEMENTS[id] ? IMPROVEMENTS[id].name : id));
    (u.districts || []).forEach(id => parts.push(DISTRICTS[id] ? DISTRICTS[id].name : id));
    if (u.revealResource) parts.push("Reveal " + (RESOURCES[u.revealResource] ? RESOURCES[u.revealResource].name : u.revealResource));
    return parts.length ? parts.join(", ") : "—";
  }

  const COL_W = 200, ROW_H = 84, PAD_X = 24, PAD_Y = 36, NODE_W = 132, NODE_H = 72;
  const tree = win.querySelector("[data-tech-tree]");
  const techs = Object.values(TECHS);

  function nodeCenter(t){
    return {
      x: PAD_X + t.column * COL_W + NODE_W / 2,
      y: PAD_Y + t.row * ROW_H + NODE_H / 2
    };
  }

  // Connector lines (Civ-style orthogonal-ish curves)
  let lines = "";
  for (const t of techs){
    for (const pid of (t.prereqs || [])){
      const p = TECHS[pid];
      if (!p) continue;
      const a = nodeCenter(p), b = nodeCenter(t);
      const mid = (a.x + b.x) / 2;
      const done = TechSystem.has(civ, p.id) && TechSystem.has(civ, t.id);
      const active = TechSystem.has(civ, p.id) || civ.researching === t.id;
      const stroke = done ? "#2a702a" : (active ? "#245edd" : "#708090");
      const w = done || active ? 2.5 : 1.5;
      lines += `<path d="M${a.x},${a.y} C${mid},${a.y} ${mid},${b.y} ${b.x},${b.y}" fill="none" stroke="${stroke}" stroke-width="${w}" opacity="0.85"/>`;
    }
  }

  // Era banners
  const eras = [
    { label: "ANCIENT ERA", x: PAD_X + 0 * COL_W },
    { label: "CLASSICAL ERA", x: PAD_X + 2.2 * COL_W }
  ];
  let eraHtml = eras.map(e => `<div class="tech-era-label" style="left:${e.x}px">${e.label}</div>`).join("");

  let nodes = "";
  for (const t of techs){
    const left = PAD_X + t.column * COL_W;
    const top = PAD_Y + t.row * ROW_H;
    let cls = "tech-node locked";
    if (TechSystem.has(civ, t.id)) cls = "tech-node done";
    else if (civ.researching === t.id) cls = "tech-node researching";
    else if (TechSystem.canResearch(civ, t.id)) cls = "tech-node available";

    let bar = "";
    if (civ.researching === t.id){
      const pct = Math.min(100, ((civ.scienceProgress || 0) / t.cost) * 100);
      bar = `<div class="tn-bar"><i style="width:${pct}%"></i></div>`;
    }

    nodes += `
      <div class="${cls}" data-tech="${t.id}" style="left:${left}px;top:${top}px" title="${t.description}">
        <div class="tn-name">${t.name}</div>
        <div class="tn-cost">${t.cost} science · ${t.era}</div>
        <div class="tn-unlocks">${unlockLine(t)}</div>
        ${bar}
      </div>`;
  }

  tree.innerHTML = `
    <svg class="tech-lines" viewBox="0 0 920 520" preserveAspectRatio="none">${lines}</svg>
    ${eraHtml}
    ${nodes}
  `;

  tree.querySelectorAll(".tech-node.available").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-tech");
      if (!TechSystem.canResearch(civ, id)) return;
      civ.researching = id;
      civ.scienceProgress = 0;
      Notify.push("Now researching " + TECHS[id].name + ".");
      refreshTechWindow();
      updateHud();
    });
  });
}

const SaveSystem = {
  save(){
    const data = {
      version: 6,
      setup: Game.setup,
      civilizations: Game.civilizations,
      playerCivId: Game.playerCivId,
      discoveredCivs: Game.discoveredCivs,
      diplomacy: Game.diplomacy,
      barbarianCamps: Game.barbarianCamps,
      nextCampId: Game.nextCampId,
      turn: Game.turn,
      units: Game.units,
      cities: Game.cities,
      districts: Game.districts,
      nextUnitId: Game.nextUnitId,
      nextCityId: Game.nextCityId,
      nextCivId: Game.nextCivId,
      nextDistrictId: Game.nextDistrictId,
      camera: Game.camera,
      settings: Game.settings,
      world: {
        w: Game.world.w, h: Game.world.h, seed: Game.world.seed,
        grid: Game.world.grid.map(row => row.map(t => ({
          terrain: t.terrain, fog: t.fog, cityId: t.cityId,
          ownerId: t.ownerId, featureSeed: t.featureSeed,
          resource: t.resource, improvement: t.improvement,
          feature: t.feature, districtId: t.districtId
        })))
      }
    };
    localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(data));
    return true;
  },
  hasSave(){ return !!localStorage.getItem(CONFIG.SAVE_KEY); },
  clear(){ localStorage.removeItem(CONFIG.SAVE_KEY); },
  load(){
    const raw = localStorage.getItem(CONFIG.SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    Game.reset();
    Game.setup = data.setup || { mapSize: "MEDIUM", aiCount: 0, difficulty: "NORMAL" };
    if (data.civilizations && data.civilizations.length){
      Game.civilizations = data.civilizations;
      Game.playerCivId = data.playerCivId || (Game.civilizations.find(c => c.isPlayer) || Game.civilizations[0]).id;
    } else if (data.civ){
      // v3 migration
      data.civ.isPlayer = true;
      data.civ.id = 1;
      Game.civilizations = [data.civ];
      Game.playerCivId = 1;
    }
    // Ensure tech fields exist on all civs (older saves)
    for (const c of Game.civilizations){
      if (!c.techs) c.techs = {};
      if (c.researching === undefined) c.researching = null;
      if (c.scienceProgress == null) c.scienceProgress = 0;
      if (c.sciencePerTurn == null) c.sciencePerTurn = 0;
    }
    Game.syncCivAlias();
    Game.discoveredCivs = data.discoveredCivs || {};
    Game.discoveredCivs[Game.playerCivId] = true;
    Game.diplomacy = data.diplomacy || {};
    Game.barbarianCamps = data.barbarianCamps || [];
    Game.nextCampId = data.nextCampId || 1;
    Game.turn = data.turn;
    Game.units = (data.units || []).map(u => {
      const def = UNIT_DEFS[u.type] || {};
      const maxH = u.maxHealth != null ? u.maxHealth : (def.maxHealth || 0);
      return {
        ...u,
        civId: u.civId != null ? u.civId : Game.playerCivId,
        charges: u.type === "BUILDER" ? (u.charges != null ? u.charges : CONFIG.BUILDER_CHARGES) : null,
        combatStrength: u.combatStrength != null ? u.combatStrength : (def.combatStrength || 0),
        maxHealth: maxH,
        health: u.health != null ? u.health : maxH,
        hasAttacked: !!u.hasAttacked,
        turnComplete: !!u.turnComplete,
        stance: u.stance || null
      };
    });
    Game.cities = (data.cities || []).map(c => ({
      buildings: [],
      project: null,
      workedTiles: [],
      culture: 0,
      cultureNeeded: 20,
      borderRadius: CONFIG.CITY_CLAIM_RADIUS,
      foodNeeded: 12,
      civId: c.civId != null ? c.civId : Game.playerCivId,
      maxHealth: c.maxHealth != null ? c.maxHealth : CONFIG.CITY_MAX_HP,
      health: c.health != null ? c.health : CONFIG.CITY_MAX_HP,
      defenseStrength: c.defenseStrength != null ? c.defenseStrength : CONFIG.CITY_BASE_DEFENSE,
      ...c
    }));
    for (const c of Game.cities){
      if (c.project && c.project.buildingId && !c.project.type){
        c.project = { type: "BUILDING", id: c.project.buildingId, progress: c.project.progress || 0 };
      }
    }
    Game.districts = data.districts || [];
    Game.nextUnitId = data.nextUnitId || 1;
    Game.nextCityId = data.nextCityId || 1;
    Game.nextCivId = data.nextCivId || 2;
    Game.nextDistrictId = data.nextDistrictId || 1;
    Game.camera = data.camera;
    Game.settings = data.settings;
    CONFIG.MAP_W = data.world.w;
    CONFIG.MAP_H = data.world.h;
    Game.world = {
      w: data.world.w, h: data.world.h, seed: data.world.seed,
      grid: data.world.grid.map(row => row.map(t => {
        const tile = { ...t, elevation: 0 };
        if (tile.ownerId === undefined) tile.ownerId = null;
        if (tile.resource === undefined) tile.resource = null;
        if (tile.improvement === undefined) tile.improvement = null;
        if (tile.feature === undefined) tile.feature = null;
        if (tile.districtId === undefined) tile.districtId = null;
        return tile;
      }))
    };
    for (let row = 0; row < Game.world.h; row++){
      for (let col = 0; col < Game.world.w; col++){
        Game.world.grid[row][col].col = col;
        Game.world.grid[row][col].row = row;
      }
    }
    Game.cities.forEach(c => Citizens.autoAssign(c));
    ConnectedResources.recompute();
    return true;
  }
};

/* ---------------------------------------------------------------------------
   15. GAME LIFECYCLE / SCREEN SWITCHING
--------------------------------------------------------------------------- */
function startNewGame(setup){
  Game.reset();
  setup = setup || {};
  const mapSize = MAP_SIZES[setup.mapSize] || MAP_SIZES.MEDIUM;
  const aiCount = Math.max(0, Math.min(setup.aiCount != null ? setup.aiCount : 3, mapSize.maxAI));
  const difficulty = AI_DIFFICULTY[setup.difficulty] ? setup.difficulty : "NORMAL";
  Game.setup = { mapSize: mapSize.id, aiCount, difficulty };

  CONFIG.MAP_W = mapSize.w;
  CONFIG.MAP_H = mapSize.h;

  const player = Game.createCivilization({
    name: setup.civName || "Rome",
    leader: setup.leaderName || "Player",
    color: "#1c62d6",
    isPlayer: true
  });

  const seed = Math.floor(Math.random() * 1e9);
  Game.world = MapGen.generate(seed);

  const totalCivs = 1 + aiCount;
  const spots = MapGen.findStartingSpots(Game.world, totalCivs);

  function placeStart(civ, spot){
    Game.addUnit("SETTLER", spot.col, spot.row, civ.id);
    const wneighbor = HexGrid.neighbors(spot.col, spot.row).find(n => {
      const t = MapGen._get(Game.world.grid, n.col, n.row, Game.world.w, Game.world.h);
      return t && TERRAIN[t.terrain].passable && !Game.unitAt(n.col, n.row);
    }) || spot;
    Game.addUnit("WARRIOR", wneighbor.col, wneighbor.row, civ.id);
  }

  placeStart(player, spots[0] || { col: Math.floor(Game.world.w/2), row: Math.floor(Game.world.h/2) });

  for (let i = 0; i < aiCount; i++){
    const template = AI_CIV_NAMES[i % AI_CIV_NAMES.length];
    const ai = Game.createCivilization({
      name: template.name,
      leader: "AI",
      color: template.color,
      isPlayer: false,
      difficulty
    });
    placeStart(ai, spots[i + 1] || spots[0]);
  }

  Barbarians.generateCamps(Game.world, spots);
  FogOfWar.recompute();
  Game.camera.zoom = 1;
  const pSpot = spots[0];
  if (pSpot) centerCameraOnStart(pSpot.col, pSpot.row);
  enterGameScreen();
}

function openNewGameSetup(){
  const sizes = Object.values(MAP_SIZES);
  const diffs = Object.values(AI_DIFFICULTY);
  showModal("New Game Setup", `
    <div class="xp-field">
      <label>Civilization name:</label>
      <input type="text" id="setup-civ-name" class="xp-input" value="Rome" maxlength="24">
    </div>
    <div class="xp-section-label">Map Size</div>
    ${sizes.map((s,i) => `<label class="xp-check"><input type="radio" name="setup-map" value="${s.id}" ${s.id==="MEDIUM"?"checked":""}> ${s.name} (${s.w}x${s.h}) — ${s.rec}</label>`).join("")}
    <div class="xp-section-label">AI Civilizations</div>
    <div class="xp-field">
      <select id="setup-ai-count" class="xp-input">
        ${[0,1,2,3,4,5,6,7,8].map(n => `<option value="${n}" ${n===3?"selected":""}>${n}</option>`).join("")}
      </select>
    </div>
    <div class="xp-section-label">AI Difficulty</div>
    <div class="xp-field">
      <select id="setup-diff" class="xp-input">
        ${diffs.map(d => `<option value="${d.id}" ${d.id==="NORMAL"?"selected":""}>${d.name}</option>`).join("")}
      </select>
    </div>
    <div class="xp-section-label">World Summary</div>
    <div class="xp-row"><span class="label">Total civilizations</span><span class="value" id="setup-total">4</span></div>
    <div class="hint-text" id="setup-warn"></div>
    <div class="modal-actions">
      <button class="xp-btn" id="modal-cancel">Cancel</button>
      <button class="xp-btn primary" id="modal-confirm">Start Game</button>
    </div>
  `);
  const aiSel = document.getElementById("setup-ai-count");
  const totalEl = document.getElementById("setup-total");
  const warn = document.getElementById("setup-warn");
  function refreshSummary(){
    const mapId = (document.querySelector('input[name="setup-map"]:checked') || {}).value || "MEDIUM";
    const map = MAP_SIZES[mapId];
    let ai = parseInt(aiSel.value, 10) || 0;
    if (ai > map.maxAI){
      ai = map.maxAI;
      aiSel.value = String(ai);
      warn.textContent = "AI count capped for this map size (max " + map.maxAI + ").";
    } else warn.textContent = "";
    totalEl.textContent = String(1 + ai);
  }
  document.querySelectorAll('input[name="setup-map"]').forEach(r => r.addEventListener("change", refreshSummary));
  aiSel.addEventListener("change", refreshSummary);
  refreshSummary();
  document.getElementById("modal-cancel").addEventListener("click", hideModal);
  document.getElementById("modal-confirm").addEventListener("click", () => {
    const mapId = (document.querySelector('input[name="setup-map"]:checked') || {}).value || "MEDIUM";
    const map = MAP_SIZES[mapId];
    let ai = parseInt(document.getElementById("setup-ai-count").value, 10) || 0;
    ai = Math.min(ai, map.maxAI);
    const civName = document.getElementById("setup-civ-name").value.trim() || "Rome";
    const difficulty = document.getElementById("setup-diff").value || "NORMAL";
    hideModal();
    startNewGame({ civName, leaderName: "Player", mapSize: mapId, aiCount: ai, difficulty });
  });
}

function loadSavedGame(){
  if (!SaveSystem.load()) return;
  enterGameScreen();
}

function enterGameScreen(){
  document.getElementById("main-menu-screen").style.display = "none";
  document.getElementById("game-screen").style.display = "block";
  resizeCanvas();
  updateHud();
  deselectUnit();
  render();
}

function returnToMenu(){
  document.getElementById("game-screen").style.display = "none";
  document.getElementById("main-menu-screen").style.display = "flex";
  refreshLoadButton();
}

function refreshLoadButton(){
  const has = SaveSystem.hasSave();
  document.getElementById("btn-load-game").disabled = !has;
  document.getElementById("load-hint").textContent = has
    ? "A saved empire was found. Continue where you left off."
    : "No saved empire found on this computer.";
}

/* ---------------------------------------------------------------------------
   16. MENU / DOCK WIRING
--------------------------------------------------------------------------- */
document.getElementById("btn-new-game").addEventListener("click", openNewGameSetup);

document.getElementById("btn-load-game").addEventListener("click", loadSavedGame);

document.getElementById("btn-settings").addEventListener("click", openSettingsWindow);
function openSettingsWindow(){
  showModal("Settings", `
    <label class="xp-check"><input type="checkbox" id="chk-grid" ${Game.settings.showGrid ? "checked" : ""}> Show hex grid lines</label>
    <label class="xp-check"><input type="checkbox" id="chk-icons" ${Game.settings.showIcons ? "checked" : ""}> Show terrain detail icons</label>
    <div class="xp-divider"></div>
    <button class="xp-btn" id="btn-clear-save">Clear Saved Game</button>
    <div class="modal-actions">
      <button class="xp-btn primary" id="modal-confirm">Close</button>
    </div>
  `);
  document.getElementById("modal-confirm").addEventListener("click", hideModal);
  document.getElementById("chk-grid").addEventListener("change", (e) => { Game.settings.showGrid = e.target.checked; render(); });
  document.getElementById("chk-icons").addEventListener("change", (e) => { Game.settings.showIcons = e.target.checked; render(); });
  document.getElementById("btn-clear-save").addEventListener("click", () => {
    SaveSystem.clear();
    refreshLoadButton();
  });
}

document.getElementById("btn-back-menu").addEventListener("click", () => {
  showModal("Return to Main Menu", `
    <p style="margin:0 0 6px;">Unsaved progress will be lost unless you save first. What would you like to do?</p>
    <div class="modal-actions">
      <button class="xp-btn" id="modal-cancel">Stay In Game</button>
      <button class="xp-btn" id="btn-save-exit">Save &amp; Exit</button>
      <button class="xp-btn primary" id="btn-exit-now">Exit Without Saving</button>
    </div>
  `);
  document.getElementById("modal-cancel").addEventListener("click", hideModal);
  document.getElementById("btn-save-exit").addEventListener("click", () => {
    SaveSystem.save(); hideModal(); returnToMenu();
  });
  document.getElementById("btn-exit-now").addEventListener("click", () => {
    hideModal(); returnToMenu();
  });
});

document.getElementById("dock-save").addEventListener("click", () => {
  SaveSystem.save();
  showModal("Game Saved", `<p style="margin:0;">Your empire has been saved to this browser.</p>
    <div class="modal-actions"><button class="xp-btn primary" id="modal-confirm">OK</button></div>`);
  document.getElementById("modal-confirm").addEventListener("click", hideModal);
});

document.getElementById("dock-cities").addEventListener("click", () => {
  if (Game.cities.length === 0){
    showModal("Empire Cities", `<p style="margin:0;">You have not founded any cities yet. Move your Settler to a good location and found your first city.</p>
      <div class="modal-actions"><button class="xp-btn primary" id="modal-confirm">OK</button></div>`);
    document.getElementById("modal-confirm").addEventListener("click", hideModal);
    return;
  }
  openEmpireWindow();
});

document.getElementById("dock-tech").addEventListener("click", () => {
  openTechWindow();
});

/* ---------------------------------------------------------------------------
   17. DESKTOP BACKGROUND CLOUDS (purely decorative, main menu only)
--------------------------------------------------------------------------- */
(function spawnClouds(){
  const bg = document.getElementById("desktop-bg");
  for (let i = 0; i < 6; i++){
    const c = document.createElement("div");
    c.className = "cloud";
    const w = 120 + Math.random() * 160;
    c.style.width = w + "px";
    c.style.height = (w * 0.4) + "px";
    c.style.top = (Math.random() * 70) + "%";
    c.style.animationDuration = (40 + Math.random() * 40) + "s";
    c.style.animationDelay = (-Math.random() * 40) + "s";
    bg.appendChild(c);
  }
})();


/* Escape soft-cancel */
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){
    if (document.getElementById("modal-overlay").style.display === "flex"){
      hideModal();
      return;
    }
    if (Game.placement){
      Districts.cancelPlacement();
      Notify.push("District placement cancelled.");
      return;
    }
    if (Game.buyTileMode){
      cancelBuyTileMode();
      Notify.push("Tile purchase cancelled.");
      return;
    }
    Selection.clear();
  }
});

/* ---------------------------------------------------------------------------
   18. INIT
--------------------------------------------------------------------------- */
resizeCanvas();
refreshLoadButton();
</script>
